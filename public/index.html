<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="BRAZOS connects local clients with skilled workers for trusted, practical help."
    />
    <meta name="theme-color" content="#1f4d3a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="BRAZOS" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png?v=3" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=3" />
    <!-- Keep MapLibre and its worker on the BRAZOS origin. The CSP build avoids
         blob workers, which are unreliable in installed iPhone PWAs. -->
    <link rel="stylesheet" href="/vendor/maplibre-gl.css?v=4.7.1-csp" />
    <script src="/vendor/maplibre-gl-csp.js?v=4.7.1-csp"></script>
    <script>
      if (window.maplibregl) {
        window.maplibregl.setWorkerUrl(
          '/vendor/maplibre-gl-csp-worker.js?v=4.7.1-csp'
        );
      }
    </script>
    <script src="/config.js?v=20260731-1"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function (error) {
            console.error('[BRAZOS] Service worker registration failed', error);
          });
        });
      }
    </script>
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        width: 100%;
        height: 100%;
        min-height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        margin: 0;
        overflow: hidden;
        background: #f7f4ed;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 100dvh;
        flex: 1;
      }
      #brazos-startup {
        align-items: center;
        background: #f7f4ed;
        color: #173d2d;
        display: flex;
        flex: 1;
        flex-direction: column;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      #brazos-startup strong {
        font-size: 32px;
        letter-spacing: -1px;
      }
      #brazos-startup p {
        color: #5f655f;
        line-height: 1.5;
        max-width: 320px;
      }
      #brazos-startup button {
        background: #205c43;
        border: 0;
        border-radius: 14px;
        color: white;
        font-size: 16px;
        font-weight: 700;
        min-height: 48px;
        padding: 0 24px;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root">
      <div id="brazos-startup" role="status">
        <strong>brazos</strong>
        <p>Starting securely…</p>
      </div>
    </div>
    <script>
      (function () {
        function showStartupError() {
          var root = document.getElementById('root');
          if (!root) return;
          root.innerHTML =
            '<div id="brazos-startup" role="alert">' +
            '<strong>brazos</strong>' +
            '<p>BRAZOS could not start. Check your connection and try again.</p>' +
            '<button type="button" onclick="window.location.reload()">Reload</button>' +
            '</div>';
        }

        window.addEventListener('error', showStartupError);
        window.addEventListener('unhandledrejection', showStartupError);

        if (!globalThis.__BRAZOS_CONFIG__) {
          showStartupError();
        }

        window.setTimeout(function () {
          if (document.getElementById('brazos-startup')) {
            showStartupError();
          }
        }, 15000);
      })();
    </script>
  </body>
</html>
