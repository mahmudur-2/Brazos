appId: app.brazos.mobile.preview
# F7 worker job (account B): My Jobs hub, Your Job (address, on my way, running late, start, photo rule, Mark complete); F6 the worker's counter-offer.
# Proves B answers A's $45 counter with $42, sees the exact address only once hired, and completes the paid main job with a photo.
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow
    optional: true
- runFlow: subflows/launch-recover.yml
- runFlow:
    file: subflows/sign-in-phone.yml
    env:
      PHONE: ${MAESTRO_E2E_PHONE_2}
      OTP: ${MAESTRO_E2E_OTP_2}
      NAME: "E2E Worker"
      LANDING: "Find work"
- runFlow: subflows/ensure-mode-worker.yml
- evalScript: "${output.marker = 'E2E ' + (typeof MAESTRO_RUN_ID === 'undefined' || !MAESTRO_RUN_ID ? 'lean' : MAESTRO_RUN_ID)}"

# ─── Side job: the customer countered $45; B counters back $42 ───────────
- tapOn: "Search for jobs or areas"
- inputText: "${output.marker} side"
- tapOn: "Search"
# Each step that closes the keyboard is followed by keyboard-settle, as in flow 03 (runs 38-39: iOS retires it ~4.8 s later).
- runFlow: subflows/keyboard-settle.yml
# Run 41: here the field's tap lost its finger-lift (Home's LiveDot hides that from Maestro), the text went nowhere
# and Search ran on an empty field. Only while the card has not shown: Search once more (a lost Search tap keeps the
# text), then the field cleared, typed and searched again. A search that showed the card is never repeated.
- extendedWaitUntil:
    visible: '${output.marker} side(, needed today)?'
    timeout: 60000
    optional: true
- runFlow:
    when:
      notVisible: '${output.marker} side(, needed today)?'
    commands:
      - tapOn:
          text: "Search"
          optional: true
      - runFlow: subflows/keyboard-settle.yml
      - extendedWaitUntil:
          visible: '${output.marker} side(, needed today)?'
          timeout: 60000
          optional: true
- runFlow:
    when:
      notVisible: '${output.marker} side(, needed today)?'
    commands:
      - tapOn:
          text: "Search for jobs or areas"
          optional: true
      - eraseText: 50
      - inputText: "${output.marker} side"
      - tapOn:
          text: "Search"
          optional: true
      - runFlow: subflows/keyboard-settle.yml
- extendedWaitUntil:
    visible: '${output.marker} side(, needed today)?'
    timeout: 60000
- tapOn:
    text: '${output.marker} side(, needed today)?'
    index: 0
- extendedWaitUntil:
    visible: "Job Details"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: 'Accept offer \(\$45\)'
    direction: DOWN
    timeout: 30000
- assertVisible: "Decline offer"
- takeScreenshot: 05-customer-counter
# The first "Send counter-offer" opens the inline form; the second (under its consequence line) sends it.
# Run 12: the button sat under the tab bar and its tap went nowhere; centre it first.
- scrollUntilVisible:
    element:
      text: "Send counter-offer"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn: "Send counter-offer"
- extendedWaitUntil:
    visible: "COUNTERING"
    timeout: 15000
- tapOn: "e.g. 45"
- inputText: "42"
- tapOn: "COUNTERING"
- runFlow: subflows/keyboard-settle.yml
- scrollUntilVisible:
    element:
      text: '.*counter-offers left; each expires after 7 days\.|Your last counter — after it, accept or decline\.'
    direction: DOWN
    timeout: 60000
- tapOn:
    text: "Send counter-offer"
    below: '.*counter-offers left; each expires after 7 days\.|Your last counter — after it, accept or decline\.'
- extendedWaitUntil:
    visible: 'Your counter-offer|No counter-offers left|Could not send.*'
    timeout: 60000
- assertVisible: "Your counter-offer"
- takeScreenshot: 05-worker-counter

# ─── Main job: hired and held → on my way → late → start → complete ──────
- launchApp:
    stopApp: true
- runFlow: subflows/launch-settle.yml
- extendedWaitUntil:
    visible: "Search for jobs or areas"
    timeout: 60000
- runFlow:
    file: subflows/home-tap.yml
    env:
      TAP: "My Jobs"
      NEXT: "Accepted work and open bids."
- extendedWaitUntil:
    notVisible: "Loading your jobs…"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: '.*${output.marker} main.*'
    direction: DOWN
    timeout: 30000
- takeScreenshot: 05-hub
- tapOn:
    text: '.*${output.marker} main.*'
    index: 0
- extendedWaitUntil:
    visible: "Your Job"
    timeout: 30000
# The hired worker reads the exact address (job_locations RLS); the open market never does.
- extendedWaitUntil:
    visible: "Directions to .*Emmons Ave.*"
    timeout: 30000
- extendedWaitUntil:
    visible: "I.m on my way"
    timeout: 30000
- takeScreenshot: 05-your-job
- tapOn: "I.m on my way"
- extendedWaitUntil:
    visible: "I.m here"
    timeout: 30000
# Run 16: the late chips sit under the floating stage bar; a tap at their place hit "I'm here".
- scrollUntilVisible:
    element:
      text: "Running 10 minutes late"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn: "Running 10 minutes late"
- extendedWaitUntil:
    visible: ".*was told ✓"
    timeout: 30000
- tapOn: "Start job now"
- extendedWaitUntil:
    visible: "Mark complete"
    timeout: 30000
# A job cannot complete without a photo: the rule is stated first, then the picker.
- tapOn: "Mark complete"
- extendedWaitUntil:
    visible: "Add a photo of the finished work"
    timeout: 15000
- tapOn: "Not yet"
- scrollUntilVisible:
    element:
      text: "Add photos or video of the finished work"
    direction: DOWN
    timeout: 60000
- runFlow:
    file: subflows/open-photo-picker.yml
    env:
      TAP: "Add photos or video of the finished work"
- tapOn:
    text: 'Photo, .*'
    index: 0
# Multi-select picker: the confirm is "Add" / "Add (1)" on older iOS and a check (run 17: no "Add"
# label) on newer; if neither label answers while the picker is still up, the check is tapped where
# it sits, top right.
- runFlow:
    when:
      visible: 'Add( \(\d+\))?|Done'
    commands:
      - tapOn: 'Add( \(\d+\))?|Done'
- runFlow:
    when:
      visible: 'Select up to \d+ items\.'
    commands:
      - tapOn:
          point: "90%,16%"
- extendedWaitUntil:
    visible: "Remove photo"
    timeout: 60000
- takeScreenshot: 05-photo-added
- tapOn: "Mark complete"
- extendedWaitUntil:
    visible: 'Finished work|Could not complete job'
    timeout: 60000
- assertNotVisible: "Could not complete job"
- assertNotVisible: "Mark complete"
- assertNotVisible: "Paid"
- takeScreenshot: 05-completed
- runFlow: subflows/sign-out.yml
