# .maestro/money-walk.yml — Gate 2 box 4: the money walk as one Maestro flow.
#
#   post → bid → accept = fund → start → complete → approve → review → released
#
# Two dedicated staging accounts (D4) sign in through sign-in.yml; their
# credentials arrive as MAESTRO_E2E_* variables from the EAS `preview`
# environment through .eas/workflows/e2e-ios.yml (D3) and are never written
# here. Every tap is on text the screens render (D15), read from the source
# on 2026-09-02 and dry-run against it command by command (E2E3); the one
# `id:` is the review star, which carries no text.
# Selectors are regular expressions that must match a whole label, so `.*`
# brackets the ones whose element folds an icon or a subtitle into its label.
appId: app.brazos.mobile.preview
---
# D7 — a title unique to this run.
- evalScript: ${output.title = 'E2E ' + Date.now()}

# ─── Act 1 · the customer posts the job ───────────────────────────────────
- runFlow:
    file: sign-in.yml
    env:
      EMAIL: ${MAESTRO_E2E_CUSTOMER_EMAIL}
      PASSWORD: ${MAESTRO_E2E_CUSTOMER_PASSWORD}
      START_IN: Hire help
      HOME_MARK: Post a job
- tapOn: "Post a job"
- extendedWaitUntil:
    visible: "STEP 1 OF 4"
    timeout: 30000
# Step 1 — Describe: a title, a description past the 20-character floor
# (lib/validation.ts), one category. The keyboard is dismissed after the last
# typed field (E2E2) before the step eyebrow is tapped, so the chips below the
# fields are reachable — E2E3 (run 01a06475): by the eyebrow tap itself, never
# hideKeyboard. Maestro's iOS hideKeyboard is a short swipe at the screen
# centre, which the multiline description swallows; the eyebrow is static text
# in the step's own ScrollView (keyboardShouldPersistTaps="handled"), and React
# Native blurs the focused input on a tap that no child handles.
- tapOn: "e.g. Walk my dog on weekdays"
- inputText: ${output.title}
- tapOn: "Describe what you need done…"
- inputText: "Cleaning of a two bedroom apartment for the end to end money walk."
- tapOn: "STEP 1 OF 4"
- tapOn: "Cleaning"
- tapOn: "Continue to Media"
# Step 2 — Media: optional, nothing attached.
- extendedWaitUntil:
    visible: "STEP 2 OF 4"
    timeout: 30000
- tapOn: "Continue to Location"
# Step 3 — Where and when (D6). The area is typed first; then the step's own
# GPS button pins the job to the simulated coordinate and replaces the typed
# area with the resolved place name. If either tier fails the typed area
# stays and an alert says so, which is dismissed. E2E3: hideKeyboard stays
# after the two single-line fields here but is optional — its centre swipe
# is unproven on this step — and the eyebrow tap that follows is the
# dismissal of record, as on step 1.
- extendedWaitUntil:
    visible: "STEP 3 OF 4"
    timeout: 30000
- tapOn: "e.g. Sheepshead Bay"
- inputText: "Sheepshead Bay, Brooklyn"
- hideKeyboard:
    optional: true
- tapOn: "STEP 3 OF 4"
- tapOn: "Use my current location"
- waitForAnimationToEnd:
    timeout: 20000
- runFlow:
    when:
      visible: "Location unavailable|Area name needed"
    commands:
      - tapOn: "OK"
- tapOn: "e.g. 2410 Emmons Ave, Apt 3B"
- inputText: "2017 Emmons Ave, Brooklyn, NY 11235"
- hideKeyboard:
    optional: true
- tapOn: "STEP 3 OF 4"
- scrollUntilVisible:
    element:
      text: "Today"
    direction: DOWN
    timeout: 20000
- tapOn: "Today"
- scrollUntilVisible:
    element:
      text: "Morning.*"
    direction: DOWN
    timeout: 20000
- tapOn: "Morning.*"
- tapOn: "Continue to Review"
# Step 4 — Review and publish. D8: the max budget is $50. E2E3: the amount
# field opens a decimal pad with no return key, inside a Modal with no scroll
# container for a centre swipe to work through, so hideKeyboard is optional
# there; Save sits above the pad and is tapped either way.
- extendedWaitUntil:
    visible: "STEP 4 OF 4"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Edit budget"
    direction: DOWN
    timeout: 20000
# 2026-09-28 (LUX-LIST-64 #36): the amount is the price field under the step
# bars — "Edit budget" is its label — which opens the price list; "Enter your
# own amount" turns it into the $ entry ("Maximum budget in dollars"), and its
# Done pill sets it. The pencil and its dialog are gone.
- tapOn: "Edit budget"
- tapOn: "Enter your own amount"
- tapOn: "Maximum budget in dollars"
- inputText: "50"
- hideKeyboard:
    optional: true
- tapOn: "Done"
- tapOn: "Publish"
# The screen fires the push pre-prompt without awaiting it, so it can land
# over the success overlay; declining is remembered only until the next
# clearState, which is why every act handles it. E2E2: a failed publish is
# the alert "Could not post job" (screens/PostJobScreen.tsx), and a job saved
# without its map pin is "Saved, but without a map pin"; either fails the
# flow here with its message inside 30 s instead of a silent timeout. E2E3: a
# new post's overlay offers "View job and bids" and "Back to Home"
# (screens/PostJobScreen.tsx, the SuccessScreen actions); "Done" belongs to
# the edit and hire variants only, and never renders here.
- extendedWaitUntil:
    visible: 'Your job is live\.|Get notified\?|Could not post job|Saved, but without a map pin'
    timeout: 30000
- assertNotVisible: 'Could not post job|Saved, but without a map pin'
- extendedWaitUntil:
    visible: 'Your job is live\.|Get notified\?'
    timeout: 30000
- runFlow:
    when:
      visible: 'Get notified\?'
    commands:
      - tapOn: "Not now"
- assertVisible: 'Your job is live\.'
- takeScreenshot: posted
- tapOn: "Back to Home"

# ─── Act 2 · the worker finds the job and bids the listed price ───────────
- runFlow:
    file: sign-in.yml
    env:
      EMAIL: ${MAESTRO_E2E_WORKER_EMAIL}
      PASSWORD: ${MAESTRO_E2E_WORKER_PASSWORD}
      START_IN: Find work
      HOME_MARK: Search for jobs or areas
# D7 — worker Home has search, so exact-title search is the one path. The
# results header quotes the query back, so the job card is the second match.
# E2E3: no hideKeyboard before Search — Maestro's iOS dismissal swipes at the
# screen centre, where this Home's category chips sit, and a chip press would
# leave the screen. The Search disc (accessibilityLabel "Search") and the
# keyboard's own search key both submit the query, so the tap needs no
# dismissal first.
- tapOn: "Search for jobs or areas"
- inputText: ${output.title}
- tapOn: "Search"
- extendedWaitUntil:
    visible:
      text: '.*${output.title}.*'
      index: 1
    timeout: 30000
- tapOn:
    text: '.*${output.title}.*'
    index: 1
- scrollUntilVisible:
    element:
      text: '.*I.ll do it for \$50.*'
    direction: DOWN
    timeout: 30000
- tapOn: '.*I.ll do it for \$50.*'
- tapOn: "Send bid"
# E2E2: a refused bid is the alert "Could not place bid"
# (screens/JobDetailScreen.tsx); the flow fails here with its message.
- extendedWaitUntil:
    visible: 'Offer sent|Could not place bid'
    timeout: 30000
- assertNotVisible: 'Could not place bid'
- extendedWaitUntil:
    visible: "Offer sent"
    timeout: 30000
- tapOn: "OK"
- runFlow:
    when:
      visible: 'Get notified\?'
    commands:
      - tapOn: "Not now"
- extendedWaitUntil:
    notVisible: "Loading your jobs…"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Pending bids"
    direction: DOWN
    timeout: 30000
- takeScreenshot: bid

# ─── Act 3 · the customer accepts the bid and funds the job ───────────────
- runFlow:
    file: sign-in.yml
    env:
      EMAIL: ${MAESTRO_E2E_CUSTOMER_EMAIL}
      PASSWORD: ${MAESTRO_E2E_CUSTOMER_PASSWORD}
      START_IN: Hire help
      HOME_MARK: Post a job
# My Jobs has no bar slot in customer mode; the [ + ] sheet's "My jobs" is the
# standing route (navigation/CustomerRoot.tsx), and the hub opens on Active,
# where an open job sits (lib/jobLifecycle.ts, deriveMyJobsTab) — no filter
# tap. E2E4 (the run on build 9f3ecf3a): the walk fell through this sheet to
# Home, whose Nearby cards — the poster's own job included — offer the
# worker-mode prompt rather than the job, and it died there looking for
# "Accept offer". The route is now asserted step by step so it can only fail
# where it breaks: the sheet must be open before its row is tapped, the hub's
# own customer subtitle on screen before the job is looked for, and the job
# screen's title before the offer is. The [ + ] answers to its
# accessibilityLabel (ui/primitives/BottomNav.tsx). The sheet title is
# bracketed because on iOS a Pressable folds its children's text into one
# label, and the sheet's full-screen backdrop is a Pressable — which is also
# why the row is matched by its exact label: a whole-sheet element would
# satisfy a bracketed pattern and be tapped at its centre, the scrim.
- tapOn: "Create"
- extendedWaitUntil:
    visible: '.*What do you need\?.*'
    timeout: 30000
- tapOn: "My jobs"
- extendedWaitUntil:
    visible: 'Jobs you posted, from first bid to final review\.'
    timeout: 30000
- extendedWaitUntil:
    notVisible: "Loading your jobs…"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: '.*${output.title}.*'
    direction: DOWN
    timeout: 30000
- tapOn: '.*${output.title}.*'
# While an offer can still be accepted the job screen titles itself
# "Job & bids" (screens/ClientJobDetailScreen.tsx, ScreenHeader); the bids
# load under it, and each pending one carries the "Accept offer" button
# (components/OfferCard.tsx).
- extendedWaitUntil:
    visible: 'Job & bids'
    timeout: 30000
- extendedWaitUntil:
    notVisible: "Loading bids…"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Accept offer"
    direction: DOWN
    timeout: 30000
- tapOn: "Accept offer"
# The ConfirmDialog's confirmText (screens/ClientJobDetailScreen.tsx). 2026-09-30 (decision C):
# with the server's quote it names the total — "Accept & pay $53.75" for the $50 bid — and it
# reads "Accept bid" only until the quote has loaded, so either is the one button to tap.
- tapOn: 'Accept & pay \$53\.75|Accept bid'
# Checkout (D8): the $50 job quotes $53.75 all-in — the 7.5% protection fee.
- extendedWaitUntil:
    visible: "Protected checkout"
    timeout: 60000
- extendedWaitUntil:
    visible: '.*Protect \$53\.75 by card.*'
    timeout: 60000
- assertVisible: '.*\$53\.75.*'
- tapOn: '.*Protect \$53\.75 by card.*'
- tapOn: "Pay & protect"
# The Stripe PaymentSheet is native; its fields answer to their labels.
- extendedWaitUntil:
    visible: 'Card number|1234 1234 1234 1234'
    timeout: 60000
- tapOn: 'Card number|1234 1234 1234 1234'
- inputText: "4242424242424242"
- tapOn: 'expiration date|MM / YY'
- inputText: "1234"
- tapOn: "CVC"
- inputText: "123"
- tapOn: "ZIP"
- inputText: "10001"
# E2E2: the sheet's keyboard is dismissed once, before Pay — never between
# its fields. E2E3: by scrolling the native sheet to its Pay button rather
# than hideKeyboard; the sheet is Stripe's and cannot be read from the source.
- scrollUntilVisible:
    element:
      text: 'Pay \$53\.75'
    direction: DOWN
    timeout: 10000
- tapOn: 'Pay \$53\.75'
# Checkout polls the ledger for `held` for 30 s and offers "Check again" past
# that; the webhook normally lands well inside the first poll. E2E2: each pass
# also watches for Checkout's own failure texts — the alert "The card was not
# charged", the "The payment did not go through" card and "Funding window
# closed" (screens/CheckoutScreen.tsx) — and fails with the one it sees.
- repeat:
    times: 3
    while:
      notVisible: "Job confirmed"
    commands:
      - runFlow:
          when:
            visible: "Check again"
          commands:
            - tapOn: "Check again"
      - extendedWaitUntil:
          visible: 'Job confirmed|The card was not charged|The payment did not go through|Funding window closed'
          timeout: 30000
          optional: true
      - assertNotVisible: 'The card was not charged|The payment did not go through|Funding window closed'
- assertVisible: "Job confirmed"
- takeScreenshot: held

# ─── Act 4 · the worker starts and completes the work ─────────────────────
- runFlow:
    file: sign-in.yml
    env:
      EMAIL: ${MAESTRO_E2E_WORKER_EMAIL}
      PASSWORD: ${MAESTRO_E2E_WORKER_PASSWORD}
      START_IN: Find work
      HOME_MARK: Search for jobs or areas
- tapOn: '.*My Jobs.*'
- extendedWaitUntil:
    notVisible: "Loading your jobs…"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: '.*${output.title}.*'
    direction: DOWN
    timeout: 30000
- tapOn: '.*${output.title}.*'
- scrollUntilVisible:
    element:
      text: "Start job"
    direction: DOWN
    timeout: 30000
- tapOn: "Start job"
- scrollUntilVisible:
    element:
      text: "Finish up"
    direction: DOWN
    timeout: 30000
# D9 — the screen requires at least one photo of the finished work. The
# system picker labels every image "Photo, <date>"; the first one is taken,
# confirmed with Add, and the upload is waited out before Mark complete.
- tapOn: "Add photos or video of the finished work"
- extendedWaitUntil:
    visible: 'Photo, .*'
    timeout: 30000
- tapOn:
    text: 'Photo, .*'
    index: 0
- tapOn: 'Add( \(\d+\))?'
# E2E6 (run 01a06511): red one step past "Mark complete" — the in-progress
# card, "1/5 photos" and no alert still on screen, the button enabled before
# the tap and 60 s after it, so no write was in flight: the tap never reached
# the handler. Two guards. The Button is disabled while an upload is in
# flight (disabled={uploadingMedia}; handleComplete returns early on the same
# flag), so the picker's "Uploading…" is waited out and the counter waited in
# before the scroll. And that tap landed at y=742 on a button laid out at
# 716–768 — under the tab bar's raised items (746–834,
# ui/primitives/BottomNav.tsx), which Maestro does not count as covering —
# so a short drag lifts the button clear before the tap; only the bar
# clearance lies below it, so the drag cannot carry it off the top.
- extendedWaitUntil:
    notVisible: "Uploading…"
    timeout: 60000
- extendedWaitUntil:
    visible: '.*1/5 photos.*'
    timeout: 60000
- scrollUntilVisible:
    element:
      text: "Mark complete"
    direction: DOWN
    timeout: 30000
- swipe:
    start: 50%, 60%
    end: 50%, 45%
    duration: 600
- tapOn: "Mark complete"
- extendedWaitUntil:
    visible: "Finished work"
    timeout: 60000
- takeScreenshot: completed

# ─── Act 5 · the customer approves, reviews, and sees the release ─────────
- runFlow:
    file: sign-in.yml
    env:
      EMAIL: ${MAESTRO_E2E_CUSTOMER_EMAIL}
      PASSWORD: ${MAESTRO_E2E_CUSTOMER_PASSWORD}
      START_IN: Hire help
      HOME_MARK: Post a job
# E2E4 — the same asserted route as Act 3: the sheet must be open before its
# row is tapped, and the customer hub on screen before the job is looked for.
- tapOn: "Create"
- extendedWaitUntil:
    visible: '.*What do you need\?.*'
    timeout: 30000
- tapOn: "My jobs"
- extendedWaitUntil:
    visible: 'Jobs you posted, from first bid to final review\.'
    timeout: 30000
- extendedWaitUntil:
    notVisible: "Loading your jobs…"
    timeout: 30000
# Work submitted and awaiting approval sits under Review (lib/jobLifecycle.ts).
- tapOn: "Review"
- scrollUntilVisible:
    element:
      text: '.*${output.title}.*'
    direction: DOWN
    timeout: 30000
- tapOn: '.*${output.title}.*'
# Past acceptance the job screen titles itself "Job detail"
# (screens/ClientJobDetailScreen.tsx, ScreenHeader).
- extendedWaitUntil:
    visible: "Job detail"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Review & approve the work"
    direction: DOWN
    timeout: 60000
# E2E6 (A2): the bar is in flow, but Maestro counts an element laid out under
# it as visible (E2E5's "Mark complete", Act 4), so every control a scroll can
# leave in the bar's band gets the same short drag before its tap.
- swipe:
    start: 50%, 60%
    end: 50%, 45%
    duration: 600
- tapOn: "Review & approve the work"
- extendedWaitUntil:
    visible: '.*Approve & release \$53\.75.*'
    timeout: 30000
- tapOn: '.*Approve & release \$53\.75.*'
# E2E6 (A1): the ConfirmDialog's own title (screens/ApproveOrDisputeScreen.tsx)
# is on screen before its confirm is tapped.
- extendedWaitUntil:
    visible: 'Release \$53\.75 to the worker\?'
    timeout: 30000
- tapOn: "Approve & release"
# E2E3: approval replaces the approval screen with Review & tip outright
# (screens/ApproveOrDisputeScreen.tsx, approveAndRelease), so the APPROVED
# eyebrow waited for here is Review & tip's own, and there is no
# "Continue to review" to tap — that link exists only when the screen opens
# on an already-settled payment.
- extendedWaitUntil:
    visible: "APPROVED · PAYOUT ON ITS WAY"
    timeout: 60000
# E2E6 (A1): the approval screen renders the same eyebrow once the release
# call returns (setPayment precedes the replace), so Review & tip's own
# header title is waited for before the screenshot and the star.
- extendedWaitUntil:
    visible: "Review & tip"
    timeout: 30000
- takeScreenshot: approved
- scrollUntilVisible:
    element:
      id: review-star-5
    direction: DOWN
    timeout: 30000
- swipe:
    start: 50%, 60%
    end: 50%, 45%
    duration: 600
- tapOn:
    id: review-star-5
- scrollUntilVisible:
    element:
      text: "Submit review"
    direction: DOWN
    timeout: 20000
- swipe:
    start: 50%, 60%
    end: 50%, 45%
    duration: 600
- tapOn: "Submit review"
- extendedWaitUntil:
    visible: 'Thanks for rating.*'
    timeout: 30000
# D10 — open the job and wait for the released copy, 480000 ms in all. The
# job screen re-reads the payment row on focus and never on a timer, so the
# wait is sixteen 30 s slices, each one backing out to the hub and re-opening
# the job from Closed, where an approved job sits. An approved job shows
# "Work approved — payout on its way" until the transfer lands.
# E2E7 (D1): every pop is a tap on the header's own back chevron. Run 01a06545
# proved the edge swipe (2%,50% → 90%,50%) pops nothing on this build — the
# hierarchy at its timeout was still Review & tip. The chevron is an unlabeled
# element: a bare Pressable with no accessibilityRole or accessibilityLabel
# (components/ScreenHeader.tsx, backLabel unset on Review & tip and on the job
# screen alike), so it is tapped by position — 6%,11% is the centre of its
# [12,81][38,108] frame on the pinned iPhone 16, 393×852.
- tapOn:
    point: "6%,11%"
# E2E7 (D2): fail fast — the pop must land on the job screen, which titles
# itself "Job detail" past acceptance (screens/ClientJobDetailScreen.tsx).
- extendedWaitUntil:
    visible: "Job detail"
    timeout: 30000
# E2E7 (D4): this scroll anchor admits the pre-release title on purpose, so the
# approval card is on screen in every slice; it never ends the loop. The only
# text that ends the loop and takes the screenshot is "Payment released", which
# the job screen renders under isReleased() alone (lib/paymentRules.ts).
- scrollUntilVisible:
    element:
      text: 'Payment released|Work approved.*'
    direction: DOWN
    timeout: 60000
- repeat:
    times: 16
    while:
      notVisible: "Payment released"
    commands:
      # E2E7 (D1): the job screen's bare chevron, the same frame as above.
      - tapOn:
          point: "6%,11%"
      # E2E6 (A1), E2E7 (D2): the hub's own subtitle, directly after the pop.
      - extendedWaitUntil:
          visible: 'Jobs you posted, from first bid to final review\.'
          timeout: 30000
      - extendedWaitUntil:
          notVisible: "Loading your jobs…"
          timeout: 30000
      - tapOn: "Closed"
      - scrollUntilVisible:
          element:
            text: '.*${output.title}.*'
          direction: DOWN
          timeout: 30000
      # E2E8: NO drag before this tap. The hub is one ScrollView that keeps
      # its offset across the pop, so the E2E6 (A2) drag accumulated slice by
      # slice once Closed held enough cards to scroll (run 01a065c7: the card
      # sat at y=150 in slice 1 and y=33 in slice 2, its centre inside the
      # fixed title-and-tab band, and the tap opened nothing). The run's own
      # job is the newest card under Closed, so with no gesture it stays clear
      # of both the header and the bottom bar in every slice.
      - tapOn: '.*${output.title}.*'
      # E2E8: fail fast — the tap must land on the job screen (E2E7 D2 shape).
      - extendedWaitUntil:
          visible: "Job detail"
          timeout: 30000
      - scrollUntilVisible:
          element:
            text: 'Payment released|Work approved.*'
          direction: DOWN
          timeout: 60000
      - extendedWaitUntil:
          visible: "Payment released"
          timeout: 30000
          optional: true
- assertVisible: "Payment released"
- takeScreenshot: released
