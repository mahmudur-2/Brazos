appId: app.brazos.mobile.preview
# F3 customer approve and close (account A): Review tab, Review & Approve (photo, report + withdraw), approve and release, Review & Tip, decline a counter, Delete job; F2 Reuse a past job.
# Proves the held main job is released only on approval, A rates B 5 stars and skips the tip, declines B's $42 counter, and a reused post can be published then deleted.
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow
    optional: true
- runFlow: subflows/launch-recover.yml
- runFlow:
    file: subflows/sign-in-phone.yml
    env:
      PHONE: ${MAESTRO_E2E_PHONE}
      OTP: ${MAESTRO_E2E_OTP}
      NAME: "E2E Customer"
      LANDING: "Hire help"
- runFlow: subflows/ensure-mode-customer.yml
- evalScript: "${output.marker = 'E2E ' + (typeof MAESTRO_RUN_ID === 'undefined' || !MAESTRO_RUN_ID ? 'lean' : MAESTRO_RUN_ID)}"

# ─── Main job: Review tab → Review & Approve ────────────────────────────
- runFlow:
    file: subflows/home-tap.yml
    env:
      TAP: "Create"
      NEXT: "My Jobs"
- extendedWaitUntil:
    visible: "My Jobs"
    timeout: 15000
- runFlow:
    file: subflows/home-tap.yml
    env:
      TAP: "My Jobs"
      NEXT: 'Back( to .*)?'
- extendedWaitUntil:
    notVisible: "Loading your jobs…"
    timeout: 30000
- tapOn: "Review"
- scrollUntilVisible:
    element:
      text: '.*${output.marker} main.*'
    direction: DOWN
    timeout: 30000
- takeScreenshot: 06-review-tab
- tapOn:
    text: '.*${output.marker} main.*'
    index: 0
- extendedWaitUntil:
    visible: "Job Details"
    timeout: 30000
- assertNotVisible: "Paid"
- tapOn: "Review & approve.*"
- extendedWaitUntil:
    visible: "Review & Approve"
    timeout: 30000
- extendedWaitUntil:
    visible: "Approve & Release Payment"
    timeout: 30000
# The worker's photo opens full screen. Run 4: the page behind the sheet has the same photo label and the same
# "Report an Issue" button, and the sheet's backdrop is labelled "Close", so the sheet's own controls are picked
# by testID, and the viewer's Close by its place beside "Share photo" (only an open viewer has it).
- tapOn:
    id: "approve-sheet-photo"
    index: 0
- extendedWaitUntil:
    visible: "Share photo"
    timeout: 15000
- takeScreenshot: 06-finished-photo
- tapOn:
    text: "Close"
    rightOf: "Share photo"
# Report an issue (holds the payment), then withdraw it.
- tapOn:
    id: "approve-sheet-report"
- extendedWaitUntil:
    visible: "Something else"
    timeout: 15000
# P12: Review & Approve is a sheet with its main action in a footer. The last reason sits below the sheet's
# fold, under that footer (a tap there would hit "Send Report", still disabled), so it is centred first;
# the report's card then opens the sheet's list, so it is scrolled back up to.
- scrollUntilVisible:
    element:
      text: "Something else"
    direction: DOWN
    timeout: 30000
    centerElement: true
- tapOn: "Something else"
- tapOn: "Send Report"
- scrollUntilVisible:
    element:
      text: "Issue reported|Could not send the report"
    direction: UP
    timeout: 60000
- assertVisible: "Issue reported"
- takeScreenshot: 06-issue-reported
- tapOn: "Withdraw Report"
- extendedWaitUntil:
    visible: 'Withdraw your issue report\?'
    timeout: 15000
- tapOn:
    text: "Withdraw Report"
    rightOf: "Cancel"
- extendedWaitUntil:
    visible: "Approve & Release Payment"
    timeout: 60000
- assertNotVisible: "Issue reported"
# Approve: the release is its own confirmed step.
- tapOn: "Approve & Release Payment"
- extendedWaitUntil:
    visible: 'Release the payment to the worker\?'
    timeout: 15000
- tapOn:
    text: "Approve & Release"
    rightOf: "Cancel"
- extendedWaitUntil:
    visible: "Review & Tip"
    timeout: 60000
- assertVisible: '.*on your say-so.*|Released on your approval\.'
- takeScreenshot: 06-released

# ─── Review & Tip: five stars and a comment; the tip is skipped ──────────
- scrollUntilVisible:
    element:
      id: "review-star-5"
    direction: DOWN
    timeout: 60000
- tapOn:
    id: "review-star-5"
- tapOn: "Share how it went with .*"
- inputText: "${output.marker} review: on time and careful."
# Run 18: a tap on the eyebrow left the keyboard up and the Submit tap landed on a key. The screen
# dismisses the keyboard on drag (keyboardDismissMode), so a swipe closes it; then the button is centred.
- swipe:
    direction: UP
- scrollUntilVisible:
    element:
      text: "Submit Review"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn: "Submit Review"
# This tap closes the keyboard (runs 38-39: iOS retires it ~4.8 s later), so keyboard-settle follows, as in flow 03.
- runFlow: subflows/keyboard-settle.yml
- extendedWaitUntil:
    visible: 'Thanks — .* has been rated\.|Thanks for rating .*'
    timeout: 60000
- scrollUntilVisible:
    element:
      text: 'Add a tip\?'
    direction: DOWN
    timeout: 30000
- assertVisible: 'Add a tip\?'
- takeScreenshot: 06-reviewed
- scrollUntilVisible:
    element:
      text: "Done"
    direction: DOWN
    timeout: 60000
- tapOn: "Done"

# ─── Side job: decline B's $42 counter on the job page ───────────────────
- launchApp:
    stopApp: true
- runFlow: subflows/launch-settle.yml
- extendedWaitUntil:
    visible: 'What do you need done\?'
    timeout: 60000
- runFlow:
    file: subflows/home-tap.yml
    env:
      TAP: "Create"
      NEXT: "My Jobs"
- extendedWaitUntil:
    visible: "My Jobs"
    timeout: 15000
- runFlow:
    file: subflows/home-tap.yml
    env:
      TAP: "My Jobs"
      NEXT: 'Back( to .*)?'
- extendedWaitUntil:
    notVisible: "Loading your jobs…"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: '.*${output.marker} side.*'
    direction: DOWN
    timeout: 30000
- tapOn:
    text: '.*${output.marker} side.*'
    index: 0
- extendedWaitUntil:
    visible: "Job Details"
    timeout: 30000
- extendedWaitUntil:
    notVisible: "Loading bids…"
    timeout: 30000
# P3: the top bid is open in place on the job page, with its own Decline, Counter and Accept. Centred, as
# in flow 04: the floating tab bar is over the page's foot, where Decline could sit.
- scrollUntilVisible:
    element:
      text: 'Accept Bid \(\$42\)'
    direction: DOWN
    timeout: 30000
    centerElement: true
# A2-M4b: the card's opener is "Decline"; the pop-up's confirm below keeps "Decline Bid".
- tapOn: "Decline"
- extendedWaitUntil:
    visible: 'Decline this \$42 bid\?'
    timeout: 15000
- tapOn:
    text: "Decline Bid"
    rightOf: "Cancel"
- extendedWaitUntil:
    notVisible: 'Decline this \$42 bid\?'
    timeout: 30000
- takeScreenshot: 06-declined

# ─── Reuse a past job: post the main job again, then delete the copy ─────
- launchApp:
    stopApp: true
- runFlow: subflows/launch-settle.yml
- extendedWaitUntil:
    visible: 'What do you need done\?'
    timeout: 60000
- runFlow:
    file: subflows/home-tap.yml
    env:
      TAP: "Create"
      NEXT: "Reuse a Past Job"
- extendedWaitUntil:
    visible: "Reuse a Past Job"
    timeout: 15000
# The row opens its strip of "Post again: …" cards in place; a second tap would close it, so it is
# tried again only where the 30 s wait below would have failed (subflows/home-tap.yml).
- runFlow:
    file: subflows/home-tap.yml
    env:
      TAP: "Reuse a Past Job"
      NEXT: 'Post again: .*'
- extendedWaitUntil:
    visible: "Post again: ${output.marker} main"
    timeout: 30000
# Run 41: the sheet sits over Home, whose LiveDot hides a lost finger-lift from Maestro; tap again while
# the wizard has not opened. home-tap.yml's pattern inline, since this tap keeps its index 0.
- repeat:
    times: 3
    while:
      notVisible: "STEP 4 OF 4"
    commands:
      - tapOn:
          text: "Post again: ${output.marker} main"
          index: 0
          optional: true
      - extendedWaitUntil:
          visible: "STEP 4 OF 4"
          timeout: 30000
          optional: true
- extendedWaitUntil:
    visible: "STEP 4 OF 4"
    timeout: 30000
- assertVisible: "Copied from .*"
- takeScreenshot: 06-reuse-review
- runFlow: subflows/publish-job.yml
- tapOn: "View Job"
- extendedWaitUntil:
    visible: "Job Details"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Delete Job"
    direction: DOWN
    timeout: 30000
- tapOn: "Delete Job"
- extendedWaitUntil:
    visible: 'Delete this job\?'
    timeout: 15000
- tapOn:
    text: "Delete Job"
    rightOf: "Cancel"
- extendedWaitUntil:
    visible: "My Jobs"
    timeout: 30000
- assertNotVisible: 'Delete this job\?'
- takeScreenshot: 06-reuse-deleted

# ─── E6 clean-up: cancel this run's side job (open, bids, never hired or paid) ─
# Every command is optional until a device run has shown it work: a clean-up must never fail flow 06.
# The sign-out below starts with a relaunch, so a step left half-done here cannot leak into it.
- launchApp:
    stopApp: true
    optional: true
- runFlow:
    file: subflows/launch-settle.yml
    optional: true
- extendedWaitUntil:
    visible: 'What do you need done\?'
    timeout: 60000
    optional: true
- runFlow:
    file: subflows/home-tap.yml
    env:
      TAP: "Create"
      NEXT: "My Jobs"
    optional: true
- extendedWaitUntil:
    visible: "My Jobs"
    timeout: 15000
    optional: true
- runFlow:
    file: subflows/home-tap.yml
    env:
      TAP: "My Jobs"
      NEXT: 'Back( to .*)?'
    optional: true
- extendedWaitUntil:
    notVisible: "Loading your jobs…"
    timeout: 30000
    optional: true
- scrollUntilVisible:
    element:
      text: '.*${output.marker} side.*'
    direction: DOWN
    timeout: 30000
    optional: true
- tapOn:
    text: '.*${output.marker} side.*'
    index: 0
    optional: true
- extendedWaitUntil:
    visible: "Job Details"
    timeout: 30000
    optional: true
# An open job with bids shows "Cancel job" at the foot of the page (screens/ClientJobDetailScreen.tsx).
- scrollUntilVisible:
    element:
      text: "Cancel job"
    direction: DOWN
    centerElement: true
    timeout: 30000
    optional: true
- tapOn:
    text: "Cancel job"
    optional: true
# The confirm (lib/moneyCopy.ts customerCancelConfirm): an open job is the no-charge case.
- extendedWaitUntil:
    visible: 'Cancel this job\?'
    timeout: 15000
    optional: true
- assertVisible:
    text: 'You haven.t paid for this job, so no money moves\..*'
    optional: true
- tapOn:
    text: "Cancel job"
    rightOf: "Cancel"
    optional: true
- extendedWaitUntil:
    visible: "This job was cancelled"
    timeout: 30000
    optional: true
# The no-payment sentence: the cancel left no payment row on this job.
- assertVisible:
    text: 'No further action is needed\..*'
    optional: true
- takeScreenshot:
    path: 06-side-cancelled
    optional: true
- runFlow: subflows/sign-out.yml
