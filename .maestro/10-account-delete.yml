appId: app.brazos.mobile.preview
# F5 delete account (account A): Account & Safety → Delete Account, its two explainer cards, the blockers list or the DELETE gate, the final confirm.
# Proves deletion is explained, blocked while a job is live or gated behind typing DELETE plus a confirm; the flow always taps Cancel, so the account survives.
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow
    optional: true
- runFlow: subflows/launch-recover.yml
- runFlow:
    file: subflows/sign-in-phone.yml
    env:
      PHONE: ${MAESTRO_E2E_PHONE}
      OTP: ${MAESTRO_E2E_OTP}
      NAME: "E2E Customer"
      LANDING: "Hire help"
- runFlow: subflows/ensure-mode-customer.yml
- runFlow:
    file: subflows/home-tap.yml
    env:
      TAP: "Profile"
      NEXT: "Switch to Worker"
# P11: the row opens in place, a drop-down, and "Delete Account" is its first row. Centred (as 08 does
# for Legal), the row it opens sits above the floating tab bar, not under it or past the screen's foot.
- scrollUntilVisible:
    element:
      text: "Account & Safety"
    direction: DOWN
    timeout: 60000
    centerElement: true
- tapOn: "Account & Safety"
- extendedWaitUntil:
    visible: "Delete Account"
    timeout: 30000
- tapOn: "Delete Account"
- extendedWaitUntil:
    visible: "What Is Removed"
    timeout: 30000
- assertVisible: "What Is Kept, and Why"
# Both the blockers' note and the DELETE field sit below the two explainer cards, off a 852 pt screen,
# and Maestro counts an off-screen element as not visible: scroll to whichever this account shows.
- scrollUntilVisible:
    element:
      text: "Finish or cancel each of these.*|Type DELETE to confirm account deletion"
    direction: DOWN
    timeout: 60000
- takeScreenshot: 10-delete-account
# A live job blocks deletion: the button stays disabled.
- runFlow:
    when:
      visible: "Finish or cancel each of these.*"
    commands:
      - scrollUntilVisible:
          element:
            text: "Finish or cancel each of these.*"
          direction: DOWN
          timeout: 60000
      - takeScreenshot: 10-blockers
      - assertVisible:
          text: "Delete My Account"
          enabled: false
# No blocker: DELETE enables the button; the confirm is always cancelled.
- runFlow:
    when:
      visible: "Type DELETE to confirm account deletion"
    commands:
      - assertVisible:
          text: "Delete My Account"
          enabled: false
      - tapOn: "Type DELETE to confirm account deletion"
      - inputText: "DELETE"
      - tapOn: "Confirm"
      - tapOn: "Delete My Account"
      - extendedWaitUntil:
          visible: 'Delete this account\?'
          timeout: 15000
      - takeScreenshot: 10-delete-confirm
      - tapOn: "Cancel"
      - extendedWaitUntil:
          notVisible: 'Delete this account\?'
          timeout: 15000
      - assertVisible: "What Is Removed"
- runFlow: subflows/sign-out.yml
