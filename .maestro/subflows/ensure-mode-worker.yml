appId: app.brazos.mobile.preview
# Shared: leaves the signed-in account in Worker mode (Profile's mode row, components/ModeSwitchRow.tsx).
# Proves the switch confirm ("Switch") swaps the tree to worker Home.
# The row's own label is "Switch to Customer" (it hides the "You're in … mode" title), so that label is the mode proof.
---
- extendedWaitUntil:
    visible: 'What do you need done\?|Search for jobs or areas'
    timeout: 60000
- runFlow:
    when:
      visible: 'What do you need done\?'
    commands:
      - tapOn: "Profile"
      - scrollUntilVisible:
          element:
            text: "Switch to Worker"
          direction: DOWN
          timeout: 20000
      - tapOn: "Switch to Worker"
      - extendedWaitUntil:
          visible: 'Switch to Worker Mode\?'
          timeout: 15000
      - tapOn: "Switch"
      - extendedWaitUntil:
          visible: 'Search for jobs or areas|Switch to Customer'
          timeout: 60000
      - runFlow:
          when:
            visible: "Switch to Customer"
          commands:
            - tapOn: "Home"
- extendedWaitUntil:
    visible: "Search for jobs or areas"
    timeout: 30000
- runFlow: dismiss-permission-prompts.yml
