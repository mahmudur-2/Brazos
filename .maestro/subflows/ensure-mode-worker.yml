appId: app.brazos.mobile.preview
# Shared: leaves the signed-in account in Worker mode (Profile's mode row, components/ModeSwitchRow.tsx).
# Proves the switch confirm ("Switch") swaps the tree to worker Home.
---
- extendedWaitUntil:
    visible: 'What do you need done\?|Search for jobs or areas'
    timeout: 60000
- runFlow:
    when:
      visible: 'What do you need done\?'
    commands:
      - tapOn: "Profile"
      - scrollUntilVisible:
          element:
            text: "Switch to Worker"
          direction: DOWN
          timeout: 20000
      - tapOn: "Switch to Worker"
      - extendedWaitUntil:
          visible: 'Switch to Worker Mode\?'
          timeout: 15000
      - tapOn: "Switch"
      - extendedWaitUntil:
          visible: 'Search for jobs or areas|You.re in Worker mode'
          timeout: 60000
      - runFlow:
          when:
            visible: "You.re in Worker mode"
          commands:
            - tapOn: "Home"
- extendedWaitUntil:
    visible: "Search for jobs or areas"
    timeout: 30000
- runFlow: dismiss-permission-prompts.yml
