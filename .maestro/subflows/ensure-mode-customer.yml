appId: app.brazos.mobile.preview
# Shared: leaves the signed-in account in Customer mode (Profile's mode row, components/ModeSwitchRow.tsx).
# Proves the switch confirm ("Switch") swaps the tree to customer Home.
# The row's own label is "Switch to Worker" (it hides the "You're in … mode" title), so that label is the mode proof.
---
- extendedWaitUntil:
    visible: 'What do you need done\?|Search for jobs or areas'
    timeout: 60000
- runFlow:
    when:
      visible: "Search for jobs or areas"
    commands:
      - runFlow:
          file: home-tap.yml
          env:
            TAP: "Profile"
            NEXT: "Switch to Customer"
      - scrollUntilVisible:
          element:
            text: "Switch to Customer"
          direction: DOWN
          timeout: 60000
      - tapOn: "Switch to Customer"
      - extendedWaitUntil:
          visible: 'Switch to Customer Mode\?'
          timeout: 15000
      - tapOn: "Switch"
      - extendedWaitUntil:
          visible: 'What do you need done\?|Switch to Worker'
          timeout: 60000
      - runFlow:
          when:
            visible: "Switch to Worker"
          commands:
            - tapOn: "Home"
- extendedWaitUntil:
    visible: 'What do you need done\?'
    timeout: 30000
- runFlow: dismiss-permission-prompts.yml
