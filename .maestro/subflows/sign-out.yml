appId: app.brazos.mobile.preview
# Shared: signs out through Profile's "Sign out" and its confirm (screens/ProfileScreen.tsx).
# A relaunch keeps the session and lands on a tab root, so this works from any screen.
---
- launchApp:
    stopApp: true
# Run 39: flow 02's driver died on the first read after this relaunch.
- runFlow: launch-settle.yml
- extendedWaitUntil:
    visible: 'What do you need done\?|Search for jobs or areas'
    timeout: 60000
- runFlow: dismiss-permission-prompts.yml
- runFlow:
    file: home-tap.yml
    env:
      TAP: "Profile"
      NEXT: 'Switch to (Worker|Customer)'
- scrollUntilVisible:
    element:
      text: "Sign out"
    direction: DOWN
    timeout: 30000
- tapOn: "Sign out"
- extendedWaitUntil:
    visible: 'Sign out\?'
    timeout: 15000
# The dialog's action sits right of its Cancel (components/ConfirmDialog.tsx); the row behind does not.
# Run 34: a tap made while the dialog was still rising was lost; tap again while it stays open.
- repeat:
    times: 3
    while:
      visible: 'Sign out\?'
    commands:
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          text: "Sign out"
          rightOf: "Cancel"
      - extendedWaitUntil:
          notVisible: 'Sign out\?'
          timeout: 5000
          optional: true
- extendedWaitUntil:
    visible: "I already have an account"
    timeout: 30000
