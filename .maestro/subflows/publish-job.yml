appId: app.brazos.mobile.preview
# Shared: Publish from the wizard's review step, then the live page.
# e2e runs 4 and 5 hung here with the job saved on staging: a fast answer interrupted the Seal's intro
# animation (components/SealTransition.tsx, fixed 2026-11-08). The 90 s wait and the one retry on
# "Could not post job" stay for a real network failure.
---
- tapOn: "Publish"
- extendedWaitUntil:
    visible: 'Your job is live\.|Get notified\?|Could not post job|Saved, but without a map pin'
    timeout: 90000
- runFlow:
    when:
      visible: "Could not post job"
    commands:
      - takeScreenshot: publish-retry
      - tapOn: "OK"
      - tapOn: "Publish"
      - extendedWaitUntil:
          visible: 'Your job is live\.|Get notified\?|Could not post job|Saved, but without a map pin'
          timeout: 90000
- assertNotVisible: "Could not post job|Saved, but without a map pin"
- runFlow: dismiss-permission-prompts.yml
- extendedWaitUntil:
    visible: 'Your job is live\.'
    timeout: 30000
