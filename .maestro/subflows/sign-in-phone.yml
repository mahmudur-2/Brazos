appId: app.brazos.mobile.preview
# Shared: phone sign-in from Welcome; a number with no account is created on the spot (name, Terms, Setup).
# Params: PHONE and OTP (11 digits, leading 1), NAME, LANDING ("Hire help" or "Find work"), WRONG_CODE ("true" = try a bad code first).
---
# Emmons Ave, Brooklyn: the place the post's "Use my current location" and the worker's distance read.
- setLocation:
    latitude: "40.5840"
    longitude: "-73.9539"
- extendedWaitUntil:
    visible: "I already have an account"
    timeout: 60000
- tapOn: "I already have an account"
- extendedWaitUntil:
    visible: "Sign in to Brazos"
    timeout: 15000
# PhoneNumberInput drops the leading 1 of a NANP number as it is typed.
- tapOn: "Phone number, United States, plus 1"
- inputText: ${PHONE}
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Enter the 6-digit code|We couldn.t send a code to that number.*|Too many requests.*"
    timeout: 30000
# GoTrue sends one code per number per 60 s; a refusal waits 25 s and asks again.
- repeat:
    times: 3
    while:
      visible: "Too many requests.*"
    commands:
      - extendedWaitUntil:
          visible: "Enter the 6-digit code"
          timeout: 25000
          optional: true
      - tapOn: "Continue"
      - extendedWaitUntil:
          visible: "Enter the 6-digit code|We couldn.t send a code to that number.*|Too many requests.*"
          timeout: 30000

# No account owns the number (sign-in never creates one): create it.
- runFlow:
    when:
      visible: "We couldn.t send a code to that number.*"
    commands:
      - tapOn: "Go back"
      - extendedWaitUntil:
          visible: "Continue with phone"
          timeout: 15000
      - tapOn: "Continue with phone"
      - extendedWaitUntil:
          visible: "One account. Two ways to use it."
          timeout: 15000
      - tapOn: "Carlos Reyes"
      - inputText: ${NAME}
      - tapOn: "Phone number, United States, plus 1"
      - inputText: ${PHONE}
      # Static text in the scaffold's ScrollView (keyboardShouldPersistTaps="handled"): the tap closes the number pad.
      - tapOn: "Switch modes to hire help or find work."
      # Below the field, so the header's "Create Account" is never the match.
      - tapOn:
          text: "Create account"
          below: "Phone number, United States, plus 1"
      - extendedWaitUntil:
          visible: "Enter the 6-digit code"
          timeout: 30000

# VerifyPhone: six cells over one hidden field, resend locked for the cooldown.
- extendedWaitUntil:
    visible: "Enter the 6-digit code"
    timeout: 30000
- assertVisible: "VERIFY YOUR NUMBER"
- assertVisible:
    text: "Resend code in .*"
    enabled: false
- runFlow:
    when:
      true: ${typeof WRONG_CODE !== 'undefined' && WRONG_CODE === 'true'}
    commands:
      - tapOn: "Verification code, 6 digits"
      - inputText: "${OTP === '000000' ? '111111' : '000000'}"
      - tapOn: "Enter the 6-digit code"
      - tapOn: "Verify and continue"
      # GoTrue answers a wrong code with otp_expired or otp_invalid (lib/phoneAuth/errors.ts).
      - extendedWaitUntil:
          visible: "That code (isn.t right|has expired).*"
          timeout: 30000
      - takeScreenshot: 01-auth-wrong-code
      - tapOn: "Verification code, 6 digits"
      - eraseText: 6
- tapOn: "Verification code, 6 digits"
- inputText: ${OTP}
- tapOn: "Enter the 6-digit code"
- tapOn: "Verify and continue"

# First sign-in of an account: Setup (Start in + Terms); a new legal version: the gate alone.
- extendedWaitUntil:
    visible: 'Set up your experience|BEFORE YOU START|What do you need done\?|Search for jobs or areas'
    timeout: 60000
- runFlow:
    when:
      visible: "Set up your experience"
    commands:
      - assertVisible: "Review Terms & Privacy to finish setup."
      - assertVisible:
          text: "Finish setup"
          enabled: false
      - tapOn: '${LANDING}\..*'
      - tapOn: 'Terms and Privacy\. Review both documents to continue\.'
      - runFlow: accept-legal.yml
      - extendedWaitUntil:
          visible: 'Terms and Privacy\. Reviewed\.'
          timeout: 30000
      - takeScreenshot: setup-done
      - tapOn: "Finish setup"
- runFlow:
    when:
      visible: "BEFORE YOU START"
    file: accept-legal.yml
- extendedWaitUntil:
    visible: 'What do you need done\?|Search for jobs or areas'
    timeout: 60000
- runFlow: dismiss-permission-prompts.yml
