appId: app.brazos.mobile.preview
# F3 customer hire and pay (account A): Payment methods, My Jobs hub, Job Details, the bid in place + counter-offer, accept, Protected Checkout, Stripe test card, Job Confirmed.
# Proves A counters the side bid, accepts the $50 main bid, pays the all-in total with 4242 (held; F8: never "Paid" before release), and the saved card can be removed.
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow
    optional: true
- runFlow: subflows/launch-recover.yml
- runFlow:
    file: subflows/sign-in-phone.yml
    env:
      PHONE: ${MAESTRO_E2E_PHONE}
      OTP: ${MAESTRO_E2E_OTP}
      NAME: "E2E Customer"
      LANDING: "Hire help"
- runFlow: subflows/ensure-mode-customer.yml
- evalScript: "${output.marker = 'E2E ' + (typeof MAESTRO_RUN_ID === 'undefined' || !MAESTRO_RUN_ID ? 'lean' : MAESTRO_RUN_ID)}"

# ─── Payment methods: start with no saved card, so Checkout takes the sheet path ─
- runFlow:
    file: subflows/home-tap.yml
    env:
      TAP: "Profile"
      NEXT: "Switch to Worker"
- scrollUntilVisible:
    element:
      text: "Payment Methods"
    direction: DOWN
    timeout: 60000
- tapOn: "Payment Methods"
- extendedWaitUntil:
    visible: "Payment Methods"
    timeout: 30000
- extendedWaitUntil:
    visible: "Saved for one-tap hiring|No card saved"
    timeout: 30000
- repeat:
    times: 5
    while:
      visible: 'Remove .*\d{4}'
    commands:
      - tapOn: 'Remove .*\d{4}'
      - extendedWaitUntil:
          visible: "Cancel"
          timeout: 15000
      - tapOn:
          text: "Remove"
          rightOf: "Cancel"
      - extendedWaitUntil:
          notVisible: "Cancel"
          timeout: 30000
- extendedWaitUntil:
    visible: "No Card Saved"
    timeout: 30000
- tapOn: 'Back( to .*)?'
- tapOn: "Home"
- extendedWaitUntil:
    visible: 'What do you need done\?'
    timeout: 30000

# ─── Side job: Bid Detail → counter-offer $45 ────────────────────────────
- runFlow:
    file: subflows/home-tap.yml
    env:
      TAP: "Create"
      NEXT: "My Jobs"
- extendedWaitUntil:
    visible: "My Jobs"
    timeout: 15000
- runFlow:
    file: subflows/home-tap.yml
    env:
      TAP: "My Jobs"
      NEXT: 'Back( to .*)?'
- extendedWaitUntil:
    notVisible: "Loading your jobs…"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: '.*${output.marker} side.*'
    direction: DOWN
    timeout: 30000
- takeScreenshot: 04-hub
- tapOn:
    text: '.*${output.marker} side.*'
    index: 0
- extendedWaitUntil:
    visible: "Job Details"
    timeout: 30000
- extendedWaitUntil:
    notVisible: "Loading bids…"
    timeout: 30000
# P3: the top bid is open in place on the job page, with its own Decline, Counter and Accept. Centred:
# with bids open the page has no bar, so the floating tab bar is over the foot, where Counter could sit.
- scrollUntilVisible:
    element:
      text: 'Accept Bid \(\$40\)'
    direction: DOWN
    timeout: 30000
    centerElement: true
- takeScreenshot: 04-bid-detail
# A2-M4b: the card's opener is "Counter"; the sheet's submit below keeps "Send Counter-Offer".
- tapOn: "Counter"
- extendedWaitUntil:
    visible: "Counter-Offer"
    timeout: 30000
- tapOn: "e.g. 45"
- inputText: "45"
- tapOn: "COUNTERING"
# Each step that closes the keyboard is followed by keyboard-settle, as in flow 03 (runs 38-39: iOS retires it ~4.8 s later).
- runFlow: subflows/keyboard-settle.yml
- tapOn: "Send Counter-Offer"
# P4: the counter is a sheet over the job page, so "Job Details" shows the whole time; the card's
# waiting line is what a sent counter leaves (components/OfferCard.tsx).
- extendedWaitUntil:
    visible: 'You countered.*|No counter-offers left|Could not send.*'
    timeout: 60000
- assertNotVisible: 'No counter-offers left|Could not send.*'
- takeScreenshot: 04-countered

# ─── Main job: accept the $50 bid → Protected Checkout → Stripe test card ─
- tapOn: 'Back( to .*)?'
- extendedWaitUntil:
    visible: '.*${output.marker} main.*'
    timeout: 30000
- tapOn:
    text: '.*${output.marker} main.*'
    index: 0
- extendedWaitUntil:
    visible: "Job Details"
    timeout: 30000
- extendedWaitUntil:
    notVisible: "Loading bids…"
    timeout: 30000
# The bids sit under the job's scope and address cards, and the open bid's Accept ends its card: each
# is scrolled to (Accept centred, as on the side job), since a tap does not scroll.
- scrollUntilVisible:
    element:
      text: "BIDS"
    direction: DOWN
    timeout: 30000
- scrollUntilVisible:
    element:
      text: 'Accept Bid \(\$50\)'
    direction: DOWN
    timeout: 30000
    centerElement: true
- tapOn: 'Accept Bid \(\$50\)'
- extendedWaitUntil:
    visible: 'Accept this bid for \$50\?'
    timeout: 15000
# The confirm names the server's all-in total once its quote loads (lib/offerCopy.ts).
- extendedWaitUntil:
    visible: 'Accept & Pay \$.*'
    timeout: 30000
- tapOn: 'Accept & Pay \$.*'
- extendedWaitUntil:
    visible: "Protected Checkout"
    timeout: 60000
- extendedWaitUntil:
    visible: 'Protect \$.* by card'
    timeout: 60000
- assertVisible: "Total Charged to Your Card"
# The save row follows the summary card, just over the floating "Protect" button: centred first, so its
# tap cannot land on the button.
- scrollUntilVisible:
    element:
      text: "Save This Card for One-Tap Hiring"
    direction: DOWN
    timeout: 30000
    centerElement: true
- tapOn: "Save This Card for One-Tap Hiring"
- takeScreenshot: 04-checkout
# P16: the tap opens the card sheet at once (no confirm before it).
- tapOn: 'Protect \$.* by card'
# The Stripe PaymentSheet is native; its fields answer to their labels. The card goes in four groups.
- extendedWaitUntil:
    visible: 'Card number|1234 1234 1234 1234'
    timeout: 60000
- tapOn: 'Card number|1234 1234 1234 1234'
- inputText: "4242"
- inputText: "4242"
- inputText: "4242"
- inputText: "4242"
- tapOn: 'expiration date|MM / YY'
- inputText: "1234"
- tapOn: "CVC"
- inputText: "123"
- tapOn: "ZIP"
- inputText: "10001"
# Runs 9 and 10: the number pad covered the Pay button and the tap on it landed on a key. The sheet's
# keyboard toolbar ends with a check that has no readable label, and Maestro's hideKeyboard swipes
# fail on this sheet, so the check is tapped where it sits (bottom right, just above the keys), then
# the sheet title as the documented fallback (a tap outside a field also ends editing).
- tapOn:
    point: "90%,61%"
- runFlow: subflows/keyboard-settle.yml
- tapOn: "Add card"
- waitForAnimationToEnd:
    timeout: 5000
- tapOn: 'Pay \$.*'
# Checkout polls the ledger for `held` and offers "Check again" past its window (screens/CheckoutScreen.tsx).
- repeat:
    times: 4
    while:
      notVisible: "Job Confirmed"
    commands:
      - runFlow:
          when:
            visible: "Check Again"
          commands:
            - tapOn: "Check Again"
      - runFlow:
          when:
            visible: "Continue — Job Confirmed"
          commands:
            - tapOn: "Continue — Job Confirmed"
      - extendedWaitUntil:
          visible: 'Job Confirmed|The card was not charged|The payment did not go through|Payment timed out'
          timeout: 30000
          optional: true
      - assertNotVisible: 'The card was not charged|The payment did not go through'
- assertVisible: "Job Confirmed"
- assertVisible: "Your card was charged. Nothing reaches the worker until you approve the finished work."
- assertNotVisible: "Paid"
- takeScreenshot: 04-job-confirmed
- tapOn: "View Job"
- extendedWaitUntil:
    visible: "Job Details"
    timeout: 30000
- assertNotVisible: "Paid"
- takeScreenshot: 04-job-held

# ─── The card the checkout saved, then removed (leaves the account card-free) ─
- launchApp:
    stopApp: true
- runFlow: subflows/launch-settle.yml
- extendedWaitUntil:
    visible: 'What do you need done\?'
    timeout: 60000
- runFlow:
    file: subflows/home-tap.yml
    env:
      TAP: "Profile"
      NEXT: "Switch to Worker"
- scrollUntilVisible:
    element:
      text: "Payment Methods"
    direction: DOWN
    timeout: 60000
- tapOn: "Payment Methods"
- extendedWaitUntil:
    visible: "Payment Methods"
    timeout: 30000
- extendedWaitUntil:
    visible: "Saved for One-Tap Hiring"
    timeout: 60000
- takeScreenshot: 04-card-saved
- tapOn: 'Remove .*4242'
- extendedWaitUntil:
    visible: "Cancel"
    timeout: 15000
- tapOn:
    text: "Remove"
    rightOf: "Cancel"
- extendedWaitUntil:
    visible: "No Card Saved"
    timeout: 30000
- runFlow: subflows/sign-out.yml
