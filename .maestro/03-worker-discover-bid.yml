appId: app.brazos.mobile.preview
# F6 worker discover and bid (account B): Map tab, Home search, results + Filters sheet, JobDetail, set-price bid, written bid, withdraw + rebid, report a job.
# Proves B finds both of A's jobs, bids $50 on the main job and $40 on the side job, never sees the exact address, and can withdraw a pending bid.
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow
    optional: true
- runFlow: subflows/launch-recover.yml
- runFlow:
    file: subflows/sign-in-phone.yml
    env:
      PHONE: ${MAESTRO_E2E_PHONE_2}
      OTP: ${MAESTRO_E2E_OTP_2}
      NAME: "E2E Worker"
      LANDING: "Find work"
- runFlow: subflows/ensure-mode-worker.yml
- evalScript: "${output.marker = 'E2E ' + (typeof MAESTRO_RUN_ID === 'undefined' || !MAESTRO_RUN_ID ? 'lean' : MAESTRO_RUN_ID)}"

# ─── Map tab ─────────────────────────────────────────────────────────────
- runFlow:
    file: subflows/home-tap.yml
    env:
      TAP: "Map"
      NEXT: "Explore nearby jobs"
- extendedWaitUntil:
    visible: "Explore nearby jobs"
    timeout: 30000
- takeScreenshot: 03-map
- tapOn: "Home"
- extendedWaitUntil:
    visible: "Search for jobs or areas"
    timeout: 30000

# ─── Main job: search → results → Filters → JobDetail → bid at the set price ─
- tapOn: "Search for jobs or areas"
- inputText: "${output.marker} main"
- tapOn: "Search"
# Each step that closes the keyboard is followed by keyboard-settle (run 38: the driver died as iOS retired it).
- runFlow: subflows/keyboard-settle.yml
# Run 41: a lost finger-lift on Home (its LiveDot hides it from Maestro) left the field unfocused, so the text went
# nowhere. Only while the card has not shown: Search once more (a lost Search tap keeps the text), then the field
# cleared, typed and searched again. A search that showed the card is never repeated.
- extendedWaitUntil:
    visible: '${output.marker} main(, needed today)?'
    timeout: 60000
    optional: true
- runFlow:
    when:
      notVisible: '${output.marker} main(, needed today)?'
    commands:
      - tapOn:
          text: "Search"
          optional: true
      - runFlow: subflows/keyboard-settle.yml
      - extendedWaitUntil:
          visible: '${output.marker} main(, needed today)?'
          timeout: 60000
          optional: true
- runFlow:
    when:
      notVisible: '${output.marker} main(, needed today)?'
    commands:
      - tapOn:
          text: "Search for jobs or areas"
          optional: true
      - eraseText: 50
      - inputText: "${output.marker} main"
      - tapOn:
          text: "Search"
          optional: true
      - runFlow: subflows/keyboard-settle.yml
- extendedWaitUntil:
    visible: '${output.marker} main(, needed today)?'
    timeout: 60000
- tapOn: 'Filters(, \d+ active)?'
- extendedWaitUntil:
    visible: "Reset filters"
    timeout: 15000
- takeScreenshot: 03-filters
- tapOn: 'Show (\d+ )?jobs?'
- extendedWaitUntil:
    notVisible: "Reset filters"
    timeout: 15000
- takeScreenshot: 03-results
- tapOn:
    text: '${output.marker} main(, needed today)?'
    index: 0
- extendedWaitUntil:
    visible: "Job Details"
    timeout: 30000
- extendedWaitUntil:
    visible: 'I.ll do it for \$50'
    timeout: 30000
# The exact address lives in job_locations, readable only by the owner and the hired worker.
- assertNotVisible: ".*2017 Emmons.*"
- takeScreenshot: 03-main-detail
- tapOn: 'I.ll do it for \$50'
- extendedWaitUntil:
    visible: 'Send a \$50 bid\?'
    timeout: 15000
- tapOn: "Send Bid"
- extendedWaitUntil:
    visible: 'Bid sent|Get notified\?|Could not place bid'
    timeout: 60000
- assertNotVisible: "Could not place bid"
- runFlow: subflows/dismiss-permission-prompts.yml
- extendedWaitUntil:
    visible: "Bid sent"
    timeout: 30000
- takeScreenshot: 03-main-bid-sent
- extendedWaitUntil:
    visible: "Your Bid"
    timeout: 30000
# Report this job: the dialog opens; nothing is sent. Centred: with no bid bar left the floating tab bar is
# back, and a link that only just scrolled into view sits under it.
- scrollUntilVisible:
    element:
      text: "Report This Job"
    direction: DOWN
    timeout: 60000
    centerElement: true
- tapOn: "Report This Job"
- extendedWaitUntil:
    visible: "Send Report"
    timeout: 15000
- takeScreenshot: 03-report-job
- tapOn: "Cancel"
- extendedWaitUntil:
    notVisible: "Send Report"
    timeout: 15000

# ─── Side job: a written bid, the pitch rule, withdraw, then bid again ───
- launchApp:
    stopApp: true
- runFlow: subflows/launch-settle.yml
- extendedWaitUntil:
    visible: "Search for jobs or areas"
    timeout: 60000
- tapOn: "Search for jobs or areas"
- inputText: "${output.marker} side"
- tapOn: "Search"
- runFlow: subflows/keyboard-settle.yml
# Run 41: the lost finger-lift on Home, handled as in the main job's search above.
- extendedWaitUntil:
    visible: '${output.marker} side(, needed today)?'
    timeout: 60000
    optional: true
- runFlow:
    when:
      notVisible: '${output.marker} side(, needed today)?'
    commands:
      - tapOn:
          text: "Search"
          optional: true
      - runFlow: subflows/keyboard-settle.yml
      - extendedWaitUntil:
          visible: '${output.marker} side(, needed today)?'
          timeout: 60000
          optional: true
- runFlow:
    when:
      notVisible: '${output.marker} side(, needed today)?'
    commands:
      - tapOn:
          text: "Search for jobs or areas"
          optional: true
      - eraseText: 50
      - inputText: "${output.marker} side"
      - tapOn:
          text: "Search"
          optional: true
      - runFlow: subflows/keyboard-settle.yml
- extendedWaitUntil:
    visible: '${output.marker} side(, needed today)?'
    timeout: 60000
- tapOn:
    text: '${output.marker} side(, needed today)?'
    index: 0
- extendedWaitUntil:
    visible: "Write a Bid"
    timeout: 30000
# P7: "Write a Bid" opens the bid form in a sheet over the job page (the sheet's title is the button's
# own words, so the form's eyebrow proves the sheet). "Send Bid" ends the sheet's scrolling form, below
# its fold once the form is filled: each "Send Bid" is scrolled to first, and the pitch and the eyebrow
# (the tap that closes the keyboard) are scrolled back to.
- tapOn: "Write a Bid"
- extendedWaitUntil:
    visible: "YOU.RE BIDDING ON"
    timeout: 30000
- tapOn: "e.g. 45"
- inputText: "40"
- tapOn: "YOU.RE BIDDING ON"
- runFlow: subflows/keyboard-settle.yml
# A bid needs a pitch (components/OfferComposer.tsx).
- scrollUntilVisible:
    element:
      text: "Send Bid"
    direction: DOWN
    timeout: 30000
- tapOn: "Send Bid"
- extendedWaitUntil:
    visible: "Add a pitch"
    timeout: 15000
- tapOn: "OK"
- scrollUntilVisible:
    element:
      text: 'Why should the customer pick you\?'
    direction: UP
    timeout: 30000
- tapOn: 'Why should the customer pick you\?'
- inputText: "I have a dolly and can do it tomorrow morning."
- scrollUntilVisible:
    element:
      text: "YOU.RE BIDDING ON"
    direction: UP
    timeout: 30000
- tapOn: "YOU.RE BIDDING ON"
- runFlow: subflows/keyboard-settle.yml
- scrollUntilVisible:
    element:
      text: "Tomorrow"
    direction: DOWN
    timeout: 30000
- tapOn: "Tomorrow"
- takeScreenshot: 03-side-bid-form
- scrollUntilVisible:
    element:
      text: "Send Bid"
    direction: DOWN
    timeout: 30000
- tapOn: "Send Bid"
- extendedWaitUntil:
    visible: 'Bid sent|Get notified\?|Could not send bid'
    timeout: 60000
- assertNotVisible: "Could not send bid"
- runFlow: subflows/dismiss-permission-prompts.yml
- extendedWaitUntil:
    visible: "Bid sent"
    timeout: 30000
- extendedWaitUntil:
    visible: "Your Bid"
    timeout: 30000
# Centred, as "Report This Job" above: the button ends the bid card, and the tab bar floats over the foot.
- scrollUntilVisible:
    element:
      text: "Withdraw Bid"
    direction: DOWN
    timeout: 60000
    centerElement: true
- tapOn: "Withdraw Bid"
- extendedWaitUntil:
    visible: 'Withdraw your bid\?'
    timeout: 15000
- tapOn:
    text: "Withdraw Bid"
    rightOf: "Cancel"
- extendedWaitUntil:
    visible: "Write a Bid"
    timeout: 30000
- assertNotVisible: "Your Bid"
- tapOn: "Write a Bid"
- extendedWaitUntil:
    visible: "YOU.RE BIDDING ON"
    timeout: 30000
- tapOn: "e.g. 45"
- inputText: "40"
- tapOn: "YOU.RE BIDDING ON"
- runFlow: subflows/keyboard-settle.yml
- tapOn: 'Why should the customer pick you\?'
- inputText: "I have a dolly and can do it tomorrow morning."
- scrollUntilVisible:
    element:
      text: "YOU.RE BIDDING ON"
    direction: UP
    timeout: 30000
- tapOn: "YOU.RE BIDDING ON"
- runFlow: subflows/keyboard-settle.yml
- scrollUntilVisible:
    element:
      text: "Send Bid"
    direction: DOWN
    timeout: 30000
- tapOn: "Send Bid"
- extendedWaitUntil:
    visible: 'Bid sent|Get notified\?|Could not send bid'
    timeout: 60000
- assertNotVisible: "Could not send bid"
- runFlow: subflows/dismiss-permission-prompts.yml
- extendedWaitUntil:
    visible: "Bid sent"
    timeout: 30000
# P6: no Bid Sent screen; the My Jobs tab opens the hub. Run 13: once B has accepted work (run 12
# onwards) the hub lists it above the bids, so the heading is scrolled to.
- tapOn: "My Jobs"
- extendedWaitUntil:
    notVisible: "Loading your jobs…"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Pending bids"
    direction: DOWN
    timeout: 30000
- takeScreenshot: 03-pending-bids
- runFlow: subflows/sign-out.yml
