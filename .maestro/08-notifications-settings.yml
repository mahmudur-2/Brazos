appId: app.brazos.mobile.preview
# F5 notifications and settings (account A): feed by day + tap routes + mark read, Notification Settings toggles + quiet hours, Profile (mode switch, appearance, Legal, details, Account & safety).
# Proves the bid notification opens its job, each preference flips and flips back, the theme switch applies, and the mode switch round-trips Customer → Worker → Customer.
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow
    optional: true
- runFlow: subflows/launch-recover.yml
- runFlow:
    file: subflows/sign-in-phone.yml
    env:
      PHONE: ${MAESTRO_E2E_PHONE}
      OTP: ${MAESTRO_E2E_OTP}
      NAME: "E2E Customer"
      LANDING: "Hire help"
- runFlow: subflows/ensure-mode-customer.yml
- evalScript: "${output.marker = 'E2E ' + (typeof MAESTRO_RUN_ID === 'undefined' || !MAESTRO_RUN_ID ? 'lean' : MAESTRO_RUN_ID)}"

# ─── Notifications feed ──────────────────────────────────────────────────
- tapOn: 'Notifications(, \d+ unread)?'
- extendedWaitUntil:
    visible: "Notification settings"
    timeout: 30000
- extendedWaitUntil:
    visible: "Today|Yesterday|This week|Earlier"
    timeout: 30000
- takeScreenshot: 08-feed
# One bid on the main job (03): its row opens that job (lib/notificationGroups.ts keeps its title).
- scrollUntilVisible:
    element:
      text: "New bid on ${output.marker} main"
    direction: DOWN
    timeout: 30000
- tapOn:
    text: "New bid on ${output.marker} main"
    index: 0
- extendedWaitUntil:
    visible: "Job & Bids|Job Details"
    timeout: 30000
- tapOn: 'Back( to .*)?'
- extendedWaitUntil:
    visible: "Notification settings"
    timeout: 30000
- runFlow:
    when:
      visible: "Mark all read"
    commands:
      - tapOn: "Mark all read"
      - extendedWaitUntil:
          notVisible: "Mark all read"
          timeout: 30000

# ─── Notification Settings: each switch off and on again ─────────────────
- tapOn: "Notification settings"
- extendedWaitUntil:
    visible: "Notification Settings"
    timeout: 30000
- extendedWaitUntil:
    visible: "Bids on my jobs"
    timeout: 30000
# Each row shows its label twice (the text, then the switch): index 1 is the switch.
- tapOn:
    text: "Messages"
    index: 1
- tapOn:
    text: "Messages"
    index: 1
- tapOn:
    text: "Bids on my jobs"
    index: 1
- tapOn:
    text: "Bids on my jobs"
    index: 1
- tapOn:
    text: "Job updates"
    index: 1
- tapOn:
    text: "Job updates"
    index: 1
- tapOn:
    text: "Hire Again requests"
    index: 1
- tapOn:
    text: "Hire Again requests"
    index: 1
- runFlow:
    when:
      visible: "Quiet hours"
    commands:
      - assertVisible: "How far is “nearby”.*"
      - tapOn:
          text: "Quiet hours"
          index: 1
      - takeScreenshot: 08-quiet-hours
      - tapOn:
          text: "Quiet hours"
          index: 1
- takeScreenshot: 08-settings
- tapOn: 'Back( to .*)?'
- extendedWaitUntil:
    visible: "Notification settings"
    timeout: 30000
- tapOn: 'Back( to .*)?'

# ─── Profile: appearance, Legal, details, Account & safety ───────────────
- tapOn: "Profile"
- extendedWaitUntil:
    visible: "Switch to Worker"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Dark"
    direction: DOWN
    timeout: 60000
- tapOn: "Dark"
- takeScreenshot: 08-profile-dark
- tapOn: "Light"
- takeScreenshot: 08-profile-light
- tapOn: "Auto — follow the system"
- scrollUntilVisible:
    element:
      text: "Legal"
    direction: DOWN
    timeout: 60000
- tapOn: "Legal"
- extendedWaitUntil:
    visible: "Terms of Service"
    timeout: 15000
- tapOn: "Terms of Service"
- extendedWaitUntil:
    visible: ".*Brazos Terms of Service.*"
    timeout: 30000
- tapOn: 'Back( to .*)?'
- scrollUntilVisible:
    element:
      text: "Privacy Policy"
    direction: DOWN
    timeout: 60000
- tapOn: "Privacy Policy"
- extendedWaitUntil:
    visible: ".*Brazos Privacy Policy.*"
    timeout: 30000
- tapOn: 'Back( to .*)?'
- scrollUntilVisible:
    element:
      text: "View your profile"
    direction: UP
    timeout: 60000
- tapOn: "View your profile"
- extendedWaitUntil:
    visible: "Profile Details"
    timeout: 30000
- takeScreenshot: 08-profile-details
- tapOn: 'Back( to .*)?'
- scrollUntilVisible:
    element:
      text: "Account & safety"
    direction: DOWN
    timeout: 60000
- tapOn: "Account & safety"
- extendedWaitUntil:
    visible: "Account & Safety"
    timeout: 30000
- assertVisible: "Delete account"
- tapOn: 'Back( to .*)?'

# ─── Mode switch round trip ──────────────────────────────────────────────
- tapOn: "Home"
- runFlow: subflows/ensure-mode-worker.yml
- takeScreenshot: 08-worker-mode
- runFlow: subflows/ensure-mode-customer.yml
- runFlow: subflows/sign-out.yml
