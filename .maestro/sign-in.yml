# .maestro/sign-in.yml — the one sign-in path (E2E1 D4/D5): a cold, signed-out
# launch, then email + password on EmailSignIn, then the Setup step that every
# clearState launch brings back (the setup record is device-local —
# lib/setupStorage.ts). Called by money-walk.yml through runFlow with:
#   EMAIL, PASSWORD  — the account, from the MAESTRO_E2E_* variables (D3)
#   START_IN         — the Setup "Start in" card: "Hire help" or "Find work"
#   HOME_MARK        — text that proves that mode's Home arrived
# Nothing here is a credential; tests/maestroFlows.test.mjs keeps it so.
appId: app.brazos.mobile.preview
---
# D6 — one fixed coordinate before every launch: Emmons Avenue, Sheepshead Bay.
- setLocation:
    latitude: 40.5840
    longitude: -73.9539
# D5 — clearState wipes AsyncStorage (the setup record, the push-prompt memory);
# clearKeychain wipes the session, which lives in expo-secure-store — without
# it the previous role would still be signed in. Never Log out.
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible: "I already have an account"
    timeout: 60000
# FIX-RUN B2: with phone auth off (the e2e-test build), this opens EmailSignIn
# directly — there is no phone screen and no "Use Email Instead" in between.
- tapOn: "I already have an account"
# AuthField labels both its caption and its input "Email"; the caption comes
# first in the hierarchy, so index 1 is the input. Same for "Password".
- tapOn:
    text: "Email"
    index: 1
- inputText: ${EMAIL}
- tapOn:
    text: "Password"
    index: 1
- inputText: ${PASSWORD}
# E2E2 (run 01a0611f): the keyboard was still up after the password and the
# Continue tap landed on it. Dismiss it first. A failed sign-in renders the
# auth error under the form (screens/EmailSignInScreen.tsx `formError` — since
# FIX-RUN B7 lib/errorMessage.ts authMessage()'s plain sentences: "That email
# and password don't match." for a wrong email or password, "Confirm your
# email first" for an unconfirmed account) or a field error above it, so the
# wait watches for those too and the flow fails here inside 30 s with the
# message instead of a silent timeout. Setup's arrival is its headline (the
# FINAL SETUP eyebrow went in LUX-LIST-64 #9).
- hideKeyboard
- tapOn: "Continue"
- extendedWaitUntil:
    visible: 'Set up your experience|That email and password don.t match\.|Confirm your email first.*|Enter your email address\.|Enter a valid email address\.|Enter your password\.'
    timeout: 30000
- assertNotVisible: 'That email and password don.t match\.|Confirm your email first.*|Enter your email address\.|Enter a valid email address\.|Enter your password\.'
- extendedWaitUntil:
    visible: "Set up your experience"
    timeout: 30000
# Terms & Privacy is accepted server-side, once, by the operator's own first
# login on this account (HANDOFF — NEEDS THE OPERATOR (a)). Without it Finish
# setup stays disabled, so the flow says so here rather than failing later.
- assertVisible: 'Terms and Privacy\. Reviewed\.|Terms and Privacy reviewed'
- tapOn: '.*${START_IN}.*'
- tapOn: "Finish setup"
- extendedWaitUntil:
    visible: '${HOME_MARK}'
    timeout: 60000
