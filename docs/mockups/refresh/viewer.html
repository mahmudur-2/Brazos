<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BRAZOS — Before and After</title>
<!-- THE REFRESH VIEWER (2026-09-26). Two live apps side by side: BEFORE is the operator's real app,
     AFTER the refresh made in a practice copy. Both run for real (sample data from mock.js, nothing
     reaches a server), so every tap, sheet and animation is the app's own. One pill switches BOTH
     between dark and light, live, the way the phone's own setting does. Built by
     docs/mockups/refresh/prepare.mjs from this template and screens.js. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#0f1211;--panel:#161a19;--line:#26302c;--ink:#e9eeeb;--muted:#9aa7a1;--acc:#84dfaa;--accInk:#062018}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,select{font:inherit}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;background:#0f1211f2;border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.brand{font-weight:800;letter-spacing:.2px;margin-right:6px;white-space:nowrap}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--muted);letter-spacing:.3px}
.title{flex:1;min-width:160px;font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.pill{display:inline-flex;background:#1b2220;border:1px solid var(--line);border-radius:20px;padding:3px}
.pill button{border:0;background:transparent;color:var(--ink);height:30px;padding:0 14px;border-radius:16px;font-weight:600;font-size:13px;cursor:pointer}
.pill button.on{background:var(--acc);color:var(--accInk)}
.btn{height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);background:#1b2220;color:var(--ink);font-weight:600;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:#3a4a43}
select.btn{padding-right:28px;max-width:260px}
main{display:flex;gap:0;min-height:calc(100% - 58px)}
aside{width:250px;flex:0 0 auto;border-right:1px solid var(--line);padding:10px 8px 40px;overflow:auto;max-height:calc(100vh - 58px);position:sticky;top:58px}
aside h4{margin:14px 8px 6px;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
aside a{display:block;padding:7px 10px;border-radius:9px;color:var(--ink);text-decoration:none;font-size:13.5px;line-height:18px}
aside a:hover{background:#1b2220}
aside a.on{background:#1f3a2e;color:#fff;font-weight:600}
aside a .st{float:right;font-size:11px;color:var(--muted)}
body.noside aside{display:none}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;padding:18px 12px 40px;overflow:hidden}
.phones{display:flex;gap:40px;justify-content:center;align-items:flex-start}
figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:10px}
figcaption{font-size:13px;font-weight:700;letter-spacing:.6px;color:var(--muted);text-transform:uppercase}
figcaption b{color:var(--ink)}
.scaler{width:393px;height:852px;transform-origin:top center}
.phone{position:relative;width:393px;height:852px;border-radius:52px;overflow:hidden;background:#000;box-shadow:0 0 0 10px #050606,0 0 0 11px #2a3330,0 30px 80px rgba(0,0,0,.55)}
.phone iframe{position:absolute;inset:0;width:393px;height:852px;border:0;display:block;background:transparent}
.status{position:absolute;left:0;right:0;top:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 44px;font:600 17px/1 Inter,-apple-system,sans-serif;pointer-events:none;z-index:5;color:#0f1512}
.status .r{display:flex;gap:6px;align-items:center}
.status svg{display:block}
.island{position:absolute;left:50%;top:11px;width:124px;height:36px;margin-left:-62px;border-radius:20px;background:#000;z-index:6;pointer-events:none}
.homebar{position:absolute;left:50%;bottom:8px;width:136px;height:5px;margin-left:-68px;border-radius:3px;background:rgba(15,21,18,.9);z-index:6;pointer-events:none}
body.dark .status{color:#fff}
body.dark .homebar{background:rgba(255,255,255,.92)}
.veil{position:absolute;inset:0;z-index:7;display:flex;align-items:center;justify-content:center;background:rgba(10,14,12,.35);color:#fff;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s}
.veil.on{opacity:1}
.veil.err{background:rgba(60,16,12,.72);opacity:1;padding:30px;text-align:center;line-height:20px;pointer-events:none}
.notes{width:min(826px,100%);margin-top:26px;display:grid;grid-template-columns:1fr 1fr;gap:40px}
.notes section h5{margin:0 0 8px;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.notes ul{margin:0;padding-left:18px;font-size:14px;line-height:21px;color:#d6ddd9}
.notes li+li{margin-top:6px}
.notes .empty{font-size:14px;color:var(--muted)}
.stand{margin-top:14px;font-size:13px;color:#f1d69a;background:#2a2412;border:1px solid #4a3f1f;border-radius:10px;padding:8px 12px;max-width:826px}
.keys{margin-top:18px;font-size:12px;color:var(--muted)}
.keys kbd{background:#1b2220;border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-family:inherit}
@media (max-width:1100px){aside{display:none}}
</style>
</head>
<body class="dark">
<header>
  <div class="brand">BRAZOS<small>BEFORE · AFTER</small></div>
  <div class="title" id="title">…<small id="sub"></small></div>
  <div class="pill" role="group" aria-label="Appearance">
    <button id="s-dark" class="on">Dark</button><button id="s-light">Light</button>
  </div>
  <button class="btn" id="replay" title="Open this screen again in both phones (replays its animations)">⟳ Replay</button>
  <button class="btn" id="prev" title="Previous screen (←)">‹ Prev</button>
  <select class="btn" id="pick" aria-label="All screens"></select>
  <button class="btn" id="next" title="Next screen (→)">Next ›</button>
  <button class="btn" id="side" title="Show or hide the list">☰</button>
</header>
<main>
  <aside id="list"></aside>
  <div class="stage" id="stage">
    <div class="phones">
      <figure><figcaption><b>Before</b> · your app today</figcaption><div class="scaler"><div class="phone" id="p-before"><iframe id="f-before" title="Before"></iframe><div class="status"><span>9:41</span><span class="r"><svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.1-1.2A10.2 10.2 0 0 0 8 .5 10.2 10.2 0 0 0 .9 3.4L2 4.6a8.5 8.5 0 0 1 6-2.4zm0 3.4c1.4 0 2.7.5 3.7 1.4l1.1-1.2A7.1 7.1 0 0 0 8 3.9 7.1 7.1 0 0 0 3.2 5.8l1.1 1.2c1-.9 2.3-1.4 3.7-1.4zm0 3.4c.5 0 1 .2 1.4.5L8 11.2 6.6 9.5c.4-.3.9-.5 1.4-.5z"/></svg><svg width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x=".5" y=".5" width="23" height="12" rx="3.5" stroke="currentColor" opacity=".45"/><rect x="2" y="2" width="20" height="9" rx="2" fill="currentColor"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" fill="currentColor" opacity=".45"/></svg></span></div><div class="island"></div><div class="homebar"></div><div class="veil" id="v-before">Opening…</div></div></div></figure>
      <figure><figcaption><b>After</b> · Lux, simpler</figcaption><div class="scaler"><div class="phone" id="p-after"><iframe id="f-after" title="After"></iframe><div class="status"><span>9:41</span><span class="r"><svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.1-1.2A10.2 10.2 0 0 0 8 .5 10.2 10.2 0 0 0 .9 3.4L2 4.6a8.5 8.5 0 0 1 6-2.4zm0 3.4c1.4 0 2.7.5 3.7 1.4l1.1-1.2A7.1 7.1 0 0 0 8 3.9 7.1 7.1 0 0 0 3.2 5.8l1.1 1.2c1-.9 2.3-1.4 3.7-1.4zm0 3.4c.5 0 1 .2 1.4.5L8 11.2 6.6 9.5c.4-.3.9-.5 1.4-.5z"/></svg><svg width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x=".5" y=".5" width="23" height="12" rx="3.5" stroke="currentColor" opacity=".45"/><rect x="2" y="2" width="20" height="9" rx="2" fill="currentColor"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" fill="currentColor" opacity=".45"/></svg></span></div><div class="island"></div><div class="homebar"></div><div class="veil" id="v-after">Opening…</div></div></div></figure>
    </div>
    <div class="stand" id="stand" hidden></div>
    <div class="notes">
      <section><h5>Before — what you have</h5><div id="n-before"></div></section>
      <section><h5>After — what changed</h5><div id="n-after"></div></section>
    </div>
    <div class="keys"><kbd>←</kbd> <kbd>→</kbd> screens · <kbd>D</kbd> dark · <kbd>L</kbd> light · <kbd>R</kbd> replay. Both phones are the real app: tap, scroll and swipe them.</div>
  </div>
</main>
<script src="shared/screens.js"></script>
<script>
(function () {
  var SCREENS = window.REFRESH_SCREENS || [];
  var byId = {}; SCREENS.forEach(function (s) { byId[s.id] = s; });
  var $ = function (id) { return document.getElementById(id); };
  var saved = {}; try { saved = JSON.parse(localStorage.getItem('refresh-viewer') || '{}'); } catch (e) { saved = {}; }
  var scheme = saved.scheme === 'light' ? 'light' : 'dark';
  var current = (location.hash || '').slice(1);
  if (!byId[current]) current = saved.screen && byId[saved.screen] ? saved.screen : (SCREENS[0] && SCREENS[0].id);
  function persist() { try { localStorage.setItem('refresh-viewer', JSON.stringify({ scheme: scheme, screen: current })); } catch (e) { /* private window */ } }

  // the list and the picker
  var groups = [];
  SCREENS.forEach(function (s) { if (groups.indexOf(s.group) < 0) groups.push(s.group); });
  $('list').innerHTML = groups.map(function (g) {
    return '<h4>' + g + '</h4>' + SCREENS.filter(function (s) { return s.group === g; }).map(function (s) {
      return '<a href="#' + s.id + '" data-id="' + s.id + '">' + s.name + (s.stand ? '<span class="st">stand-in</span>' : '') + '</a>';
    }).join('');
  }).join('');
  $('pick').innerHTML = groups.map(function (g) {
    return '<optgroup label="' + g + '">' + SCREENS.filter(function (s) { return s.group === g; }).map(function (s) { return '<option value="' + s.id + '">' + s.name + '</option>'; }).join('') + '</optgroup>';
  }).join('');

  function urlFor(app, s) {
    var steps = (app === 'after' && s.afterSteps) ? s.afterSteps : s.steps;
    var q = 'app=' + app + '&scheme=' + scheme + '&land=' + (s.land || 'app') + '&mode=' + (s.mode || 'customer') + (s.draft ? '&draft=1' : '');
    if (steps && steps.length) q += '&steps=' + encodeURIComponent(JSON.stringify(steps));
    return app + '/index.html?' + q;
  }
  function list(items) { return items && items.length ? '<ul>' + items.map(function (t) { return '<li>' + t + '</li>'; }).join('') + '</ul>' : '<div class="empty">Nothing to note.</div>'; }
  function open(id) {
    var s = byId[id]; if (!s) return;
    current = id; persist();
    if (location.hash !== '#' + id) history.replaceState(null, '', '#' + id);
    $('title').innerHTML = s.name + '<small>' + s.group + (s.mode === 'worker' ? ' · worker mode' : s.land === 'app' || !s.land ? ' · customer mode' : '') + '</small>';
    document.title = 'BRAZOS — ' + s.name + ' — Before and After';
    $('pick').value = id;
    Array.prototype.forEach.call(document.querySelectorAll('aside a'), function (a) { a.classList.toggle('on', a.getAttribute('data-id') === id); });
    $('n-before').innerHTML = list(s.before);
    $('n-after').innerHTML = list(s.after);
    $('stand').hidden = !s.stand; $('stand').textContent = s.stand || '';
    ['before', 'after'].forEach(function (app) {
      var v = $('v-' + app); v.className = 'veil on'; v.textContent = 'Opening…';
      $('f-' + app).src = urlFor(app, s);
    });
  }
  function step(d) { var i = SCREENS.findIndex(function (s) { return s.id === current; }); open(SCREENS[(i + d + SCREENS.length) % SCREENS.length].id); }
  function setScheme(next) {
    scheme = next; persist();
    document.body.classList.toggle('dark', next === 'dark');
    $('s-dark').classList.toggle('on', next === 'dark'); $('s-light').classList.toggle('on', next === 'light');
    ['before', 'after'].forEach(function (app) { try { $('f-' + app).contentWindow.postMessage({ type: 'scheme', value: next }, '*'); } catch (e) { /* not loaded */ } });
  }
  window.addEventListener('message', function (e) {
    var m = e.data || {}; if (m.source !== 'refresh-app') return;
    var v = $('v-' + m.app); if (!v) return;
    if (m.type === 'arrived') v.className = 'veil';
    if (m.type === 'lost') { v.className = 'veil err'; v.textContent = 'This screen could not be opened here: ' + (m.error || 'unknown') + '. The app is live underneath — tap your way there.'; setTimeout(function () { v.className = 'veil'; }, 4000); }
  });
  $('s-dark').onclick = function () { setScheme('dark'); };
  $('s-light').onclick = function () { setScheme('light'); };
  $('replay').onclick = function () { open(current); };
  $('prev').onclick = function () { step(-1); };
  $('next').onclick = function () { step(1); };
  $('pick').onchange = function () { open(this.value); };
  $('side').onclick = function () { document.body.classList.toggle('noside'); };
  window.addEventListener('hashchange', function () { var id = location.hash.slice(1); if (byId[id] && id !== current) open(id); });
  document.addEventListener('keydown', function (e) {
    if (e.target && (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT')) return;
    if (e.key === 'ArrowRight') step(1); else if (e.key === 'ArrowLeft') step(-1);
    else if (e.key === 'd' || e.key === 'D') setScheme('dark'); else if (e.key === 'l' || e.key === 'L') setScheme('light');
    else if (e.key === 'r' || e.key === 'R') open(current);
  });
  // fit both phones to the window's height
  function fit() {
    var avail = window.innerHeight - 58 - 18 - 30 - 20;
    var sc = Math.max(0.55, Math.min(1, avail / 852));
    Array.prototype.forEach.call(document.querySelectorAll('.scaler'), function (el) { el.style.transform = 'scale(' + sc + ')'; el.style.marginBottom = (852 * sc - 852) + 'px'; el.style.width = '393px'; el.parentNode.style.width = (393 * sc) + 'px'; });
  }
  window.addEventListener('resize', fit); fit();
  setScheme(scheme);
  if (current) open(current);
})();
</script>
</body>
</html>
