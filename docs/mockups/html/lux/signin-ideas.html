<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BRAZOS — Sign in with email, LIGHT — NOW and six steps, the B removed</title>
<!-- Hand-written (not from lux.build.mjs): IDEAS for the email sign-in screen
     (screens/EmailSignInScreen.tsx) in LIGHT, as the operator's phone showed it
     on 2026-09-21. NOW is the shipped screen, honest to its source: the 56 mark
     (components/BrandLogo.tsx), the 13/800 eyebrow, the 30/35 sans headline, the
     two 54 controls at radius 16 (components/AuthButton.tsx), the 54 fields at
     radius 14 (components/AuthField.tsx), the soft teal contour in the corner
     (components/AuthBackdrop.tsx 'soft'), the actions pinned 24 above the safe
     inset. Then six steps, each adding ONE thing to the one before, every one
     with the mark removed:
       a  the B removed, nothing else moved
       b  + the headline in the shipped Welcome's serif (Georgia 34/38, -.4)
       c  + the bar's duplicate "Sign in" dropped (the chevron stays); the
            eyebrow tracked as the Welcome's (13/700, 2)
       d  + the Welcome's controls (welcome-ship-light.html): Continue lit —
            58 tall, radius 22, the gold hairline, the trailing chevron — and
            the phone action outlined, with its glyph
       e  + the Welcome's ground and its five gold arcs in place of the teal
            contour (the glow, the gold corner, the foot shade)
       f  + the password eye screens/EmailCreateAccountScreen.tsx already draws
     Every control the live screen has is on every frame and the copy is the
     screen's own. Colours are the app's light tokens (ui/tokens.ts,
     lib/authTheme.ts). Nothing here is applied to the app.
     Shoot with: node docs/mockups/html/shoot.mjs lux/signin-ideas.html -->
<style>
:root{--bg:#F4F1E8;--ink:#13201B;--muted:#6B7566;--subtle:#9AA38F;--line:#DDD6C4;--ghostLine:#DDE2DD;--acc:#0D6B52;--forest:#064C3B;--gold:#C8A15B;--surface:#FFFFFF}
html,body{margin:0;background:#0d0d0d;color:#ddd;font-family:-apple-system,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
h1{font-size:22px;margin:24px 24px 4px;color:#eee}
.lead{margin:0 24px 18px;color:#9aa39e;font-size:14px;max-width:980px;line-height:20px}
.stage{display:flex;flex-wrap:wrap;gap:28px;justify-content:center;padding:8px 16px 40px}
.slot{display:flex;flex-direction:column;align-items:center;gap:10px;width:393px}
.slot-label{font-size:13px;font-weight:700;color:#cfd6d2}
.slot-note{font-size:12px;color:#8a938e;line-height:17px;text-align:center;max-width:370px}
p{margin:0}

/* ===== the phone, as the app draws this screen ===== */
.phone{position:relative;width:393px;height:852px;overflow:hidden;border-radius:44px;color:var(--ink);background:var(--bg);box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.status{position:absolute;left:0;right:0;top:0;height:54px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 8px 34px;color:var(--ink);font-weight:600;font-size:17px;z-index:3}
.status .r{display:flex;gap:6px;align-items:center;font-size:12px}
.status .r i{display:inline-block;width:22px;height:11px;border:1.5px solid currentColor;border-radius:3px}
.home-bar{position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:rgba(19,32,27,.85);z-index:4}
.tag{position:absolute;left:50%;bottom:21px;transform:translateX(-50%);height:24px;padding:0 12px;border-radius:12px;background:rgba(19,32,27,.9);color:#F3F1E8;font-size:12px;font-weight:700;letter-spacing:.3px;line-height:24px;white-space:nowrap;z-index:5}

/* the soft contour (AuthBackdrop 'soft'): one wash disc and three hairline rings
   about a centre parked past the top-right corner — widths 165, 228, 291, the
   inner two the stronger stroke */
.bd{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.ring{position:absolute;border-radius:50%;border:.67px solid}
.wash{position:absolute;border-radius:50%;background:rgba(211,232,223,.38)}
/* the Welcome's ground (AuthScaffold GROUND, light alphas) and its five gold arcs */
.glowbg{position:absolute;inset:0;background:radial-gradient(ellipse 72% 46% at 50% 36%,rgba(13,107,82,.07),rgba(13,107,82,0) 70%)}
.corner{position:absolute;inset:0;background:radial-gradient(circle 300px at 100% 0%,rgba(200,161,91,.16),rgba(200,161,91,0) 100%)}
.foot{position:absolute;inset:0;background:linear-gradient(180deg,rgba(16,38,29,0) 62%,rgba(16,38,29,.07) 100%)}
.arc{position:absolute;border-radius:50%;border:1px solid}

/* the safe area and the bar */
.safe{position:absolute;left:0;right:0;top:54px;bottom:34px;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:4px 16px 8px}
.ib{width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.ib svg{width:22px;height:22px;color:var(--acc)}
.ttl{flex:1;text-align:center;font-size:21px;font-weight:600;color:var(--ink);line-height:26px}
.content{flex:1;display:flex;flex-direction:column;padding:0 20px}
.body{flex:1;display:flex;flex-direction:column;padding:8px 0 24px}
.logo{width:56px;height:56px}
.logo img{width:56px;height:56px;display:block}
.eyebrow{margin-top:24px;font-size:13px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--acc);line-height:18px}
.title{margin-top:8px;font-size:30px;line-height:35px;font-weight:700;color:var(--ink)}
.sub{margin-top:8px;font-size:16px;line-height:24px;color:var(--muted)}
.form{margin-top:24px;display:flex;flex-direction:column;gap:16px}
.fld{display:flex;flex-direction:column;gap:6px}
.lbl{margin-left:2px;font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--acc);line-height:16px}
.field{height:54px;box-sizing:border-box;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;padding-left:14px;padding-right:14px}
/* .glyph, not .lead — the page's intro paragraph is .lead (margin 0 24px 18px), and the
   first shoot had the icons wearing that margin: 24 to each side and lifted 9 */
.field .glyph{width:20px;height:20px;flex:0 0 auto;color:var(--acc)}
.field .ph{flex:1;padding-left:12px;font-size:16px;color:var(--subtle);letter-spacing:0}
.field .ph.dots{letter-spacing:2px;font-size:14px}
.field .trail{width:20px;height:20px;flex:0 0 auto;color:var(--acc)}
.actions{margin-top:auto;padding-top:32px;display:flex;flex-direction:column;gap:12px}
/* the controls as shipped: 54 at radius 16, the 19/700 label */
.btn{height:54px;box-sizing:border-box;border-radius:16px;border:1px solid transparent;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700}
.btn.primary{background:var(--forest);color:#FFFFFF}
.btn.ghost{background:transparent;border-color:var(--ghostLine);color:var(--forest)}
/* the Welcome's controls: 58 at radius 22, the gold hairline, 17/600, the chevron at 18 */
.hero{position:relative;height:58px;box-sizing:border-box;border-radius:22px;border:1px solid rgba(200,161,91,.62);display:flex;align-items:center;justify-content:center;gap:12px;font-size:17px;font-weight:600;letter-spacing:.1px}
.hero.lit{background:var(--forest);color:#FFFFFF;box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.hero.out{background:transparent;color:var(--forest)}
.hero > svg.g{width:22px;height:22px;color:var(--forest)}
.hero svg.c{position:absolute;right:18px;top:50%;width:18px;height:18px;margin-top:-9px}
.hero.lit svg.c{color:var(--gold)}
.hero.out svg.c{color:var(--forest)}

/* the steps */
.v-serif .title{font-family:Georgia,"Times New Roman",serif;font-size:34px;line-height:38px;letter-spacing:-.4px}
.v-nobar .ttl{visibility:hidden}
.v-nobar .eyebrow{font-weight:700;letter-spacing:2px;line-height:17px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></symbol>
<symbol id="i-mail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.6"/><path d="m3.6 7.6 8.4 5.9 8.4-5.9"/></symbol>
<symbol id="i-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="10.5" rx="2.6"/><path d="M8.3 10.5V7.8a3.7 3.7 0 0 1 7.4 0v2.7"/></symbol>
<symbol id="i-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12s3.5-6.5 9.5-6.5S21.5 12 21.5 12s-3.5 6.5-9.5 6.5S2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></symbol>
<symbol id="i-phone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="6.6" y="2.6" width="10.8" height="18.8" rx="2.8"/><path d="M10.5 18.2h3"/></symbol>
<symbol id="i-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></symbol>
</defs></svg>

<h1>Sign in with email — NOW, then six small steps (light)</h1>
<p class="lead">Each step adds one thing to the one before it. Every frame keeps every control the screen has and its own words. Pick a letter; the pick becomes the reference the app is matched to.</p>
<div class="stage" id="stage"></div>

<script>
const STEPS = [
  { key: 'now', tag: 'NOW', label: 'NOW — as shipped', note: 'The 56 B mark, the sans headline, the teal contour, two 54 controls.', logo: true },
  { key: 'a', tag: 'a · B removed', label: 'a — the B removed', note: 'Nothing else moves; the block simply starts higher.' },
  { key: 'b', tag: 'b · + serif headline', label: 'b — + the Welcome’s serif', note: 'The headline in Georgia 34/38, as the shipped Welcome page.', serif: true },
  { key: 'c', tag: 'c · + bar title dropped', label: 'c — + the duplicate “Sign in” dropped', note: 'The bar keeps its chevron only; the headline names the page. The eyebrow tracked as the Welcome’s.', serif: true, nobar: true },
  { key: 'd', tag: 'd · + Welcome’s buttons', label: 'd — + the Welcome’s controls', note: 'Continue lit: 58 tall, radius 22, the gold hairline, the chevron. Phone outlined, with its glyph.', serif: true, nobar: true, hero: true },
  { key: 'e', tag: 'e · + Welcome’s ground', label: 'e — + the Welcome’s ground', note: 'Its five gold arcs in place of the teal contour; the glow, the gold corner, the foot shade.', serif: true, nobar: true, hero: true, ground: true },
  { key: 'f', tag: 'f · + password eye', label: 'f — + the password eye', note: 'Show / hide, as Create account already has. The one added control.', serif: true, nobar: true, hero: true, ground: true, eye: true },
];

// AuthBackdrop 'soft' at 393 x 852: centre (width*1.04, -height*.05), rings width*.42 + width*.16 steps, the wash width*.75.
function softContour() {
  const W = 393, H = 852, cx = W * 1.04, cy = -H * 0.05, wash = W * 0.75;
  const rings = [0, 1, 2].map(i => {
    const d = W * 0.42 + W * 0.16 * i;
    const c = i < 2 ? 'rgba(13,107,82,.09)' : 'rgba(13,107,82,.05)';
    return `<div class="ring" style="left:${(cx - d / 2).toFixed(1)}px;top:${(cy - d / 2).toFixed(1)}px;width:${d.toFixed(1)}px;height:${d.toFixed(1)}px;border-color:${c}"></div>`;
  }).join('');
  return `<div class="bd"><div class="wash" style="left:${(cx - wash / 2).toFixed(1)}px;top:${(cy - wash / 2).toFixed(1)}px;width:${wash}px;height:${wash}px"></div>${rings}</div>`;
}
// welcome-ship-light.html's corner, byte for byte.
function welcomeArcs() {
  const arcs = [[350, -170, 260, .36], [320, -200, 320, .30], [290, -230, 380, .24], [260, -260, 440, .18], [230, -290, 500, .12]];
  return `<div class="glowbg"></div><div class="corner"></div><div class="bd">${arcs.map(([l, t, w, a]) => `<div class="arc" style="left:${l}px;top:${t}px;width:${w}px;height:${w}px;border-color:rgba(200,161,91,${a})"></div>`).join('')}</div>`;
}
function actions(o) {
  if (!o.hero) return `<div class="btn primary">Continue</div><div class="btn ghost">Use Phone Number Instead</div>`;
  return `<div class="hero lit"><span>Continue</span><svg class="c"><use href="#i-chev"/></svg></div>
    <div class="hero out"><svg class="g"><use href="#i-phone"/></svg><span>Use Phone Number Instead</span><svg class="c"><use href="#i-chev"/></svg></div>`;
}
function frame(o) {
  const cls = ['phone', o.serif && 'v-serif', o.nobar && 'v-nobar'].filter(Boolean).join(' ');
  return `<div class="${cls}" data-shot="lux-signin-idea-${o.key}">
    <div class="status"><span>9:41</span><span class="r">●●● <i></i></span></div>
    ${o.ground ? welcomeArcs() : softContour()}
    ${o.ground ? '<div class="foot"></div>' : ''}
    <div class="safe">
      <div class="topbar"><div class="ib"><svg><use href="#i-back"/></svg></div><div class="ttl">Sign in</div><div class="ib"></div></div>
      <div class="content"><div class="body">
        ${o.logo ? '<div class="logo"><img src="../../../../assets/brand/brazos-b-leaf.png" alt="BRAZOS"></div>' : ''}
        <div class="eyebrow">Welcome back</div>
        <div class="title">Sign in to BRAZOS</div>
        <p class="sub">Use the email and password connected to your account.</p>
        <div class="form">
          <div class="fld"><div class="lbl">Email</div><div class="field"><svg class="glyph"><use href="#i-mail"/></svg><span class="ph">you@example.com</span></div></div>
          <div class="fld"><div class="lbl">Password</div><div class="field"><svg class="glyph"><use href="#i-lock"/></svg><span class="ph dots">••••••••</span>${o.eye ? '<svg class="trail"><use href="#i-eye"/></svg>' : ''}</div></div>
        </div>
        <div class="actions">${actions(o)}</div>
      </div></div>
    </div>
    <div class="tag">${o.tag}</div>
    <div class="home-bar"></div>
  </div>`;
}
document.getElementById('stage').innerHTML = STEPS.map(o =>
  `<div class="slot">${frame(o)}<div class="slot-label">${o.label}</div><div class="slot-note">${o.note}</div></div>`
).join('');
</script>
</body>
</html>
