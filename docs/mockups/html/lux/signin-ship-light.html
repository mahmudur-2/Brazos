<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BRAZOS — Sign in with email AS SHIPPED, LIGHT — the B removed, the Welcome's type and controls, Continue riding the keyboard</title>
<!-- Hand-written (not from lux.build.mjs): THE SHIP PAGE for screens/EmailSignInScreen.tsx
     — the operator's pick from signin-ideas.html on 2026-09-21: step d ("make it d") WITH
     the bar's "Sign in" kept ("also add the sign in on top"), then, from the phone the same
     evening (DECISIONS 21): "Brazos" not "BRAZOS" in the headline; the back control an
     iPhone-style circle with a press; Continue sliding up with the keyboard and staying on
     it; the column moved higher while the keyboard is up so the button never overlaps the
     password field. So, against the shipped screen: the 56 B mark is GONE; the eyebrow is the
     Welcome's (13/700, tracked 2, on a 17 line); the headline is the Welcome's serif
     (Georgia 34/38, tracked -.4, weight 700), "Sign in to Brazos"; the two actions are the
     Welcome's controls (welcome-ship-light.html) — Continue lit: 58 tall, radius 22, the
     gold hairline at .62, the specular edge, the 17/600 label, the gold chevron 18 at 18 from
     the right; the phone action outlined: the same box, no fill, the forest label with the
     phone glyph 22 before it and the forest chevron; the back control a 36 disc at the ink's
     .08 with the chevron 20 inside the 44 target. What did NOT move: the bar's "Sign in"
     21/600, the soft teal contour (components/AuthBackdrop.tsx 'soft'), the body copy
     16/24, the two 54 fields at radius 14 with their emerald glyphs (20, 14 in from the
     edge, the text 12 after), the 20 gutters, the actions ending 24 above the safe inset (58
     above the bottom on a 34 inset), the 12 between them.
     TWO FRAMES. `lux-signin-ship-light` is the screen at rest. `lux-signin-ship-light-keyboard`
     is the screen while the email field is being typed in, on an 852-tall phone whose email
     keyboard with its autofill bar stands 336: the keyboard drawn as a flat labelled slab (a
     stand-in — the system draws the real one), Continue 12 above it (its column rests 12 + 12
     above the inset and rises by the keyboard's height less both), the column LIFTED 24 — the
     air between the bar and the eyebrow — so the password field's bottom sits 17 clear of
     the button here and more on every taller phone; the phone action is under the keyboard.
     The app's light tokens throughout (ui/tokens.ts, lib/authTheme.ts). THIS is the page the
     screen is matched to, region by region; dark follows from the same components' dark
     roles, as the Welcome's did.
     DECISIONS 22 (2026-09-21, from the phone, after 21 reached it): "get rid of the go … don't
     add space between keyboard and the continue button … for both screens continue should
     always be on top, not the instead pills". So BOTH controls are the pinned footer —
     Continue on top, the "Instead" route under it, 12 between — and the keyboard frame's rise
     is the keyboard's height less the inset, the two 12 gaps and the 70 under Continue
     (208 here), so Continue's bottom edge sits ON the keyboard and the "Instead" route is
     under it; the body's least air above the footer is 32. The phone field asks for no
     return key, so iOS floats no "Go" pill over its number pad.
     Shoot with: node docs/mockups/html/shoot.mjs lux/signin-ship-light.html -->
<style>
:root{--bg:#F4F1E8;--ink:#13201B;--muted:#6B7566;--subtle:#9AA38F;--line:#DDD6C4;--acc:#0D6B52;--forest:#064C3B;--gold:#C8A15B;--surface:#FFFFFF}
html,body{margin:0;background:#0d0d0d;color:#ddd;font-family:-apple-system,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.stage{display:flex;gap:28px;justify-content:flex-start;padding:24px}
.slot{display:flex;flex-direction:column;align-items:center;gap:10px;width:393px}
.slot-label{font-size:13px;font-weight:700;color:#cfd6d2}
p{margin:0}

/* the phone */
.phone{position:relative;width:393px;height:852px;overflow:hidden;border-radius:44px;color:var(--ink);background:var(--bg);box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.status{position:absolute;left:0;right:0;top:0;height:54px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 8px 34px;color:var(--ink);font-weight:600;font-size:17px;z-index:3}
.status .r{display:flex;gap:6px;align-items:center;font-size:12px}
.status .r i{display:inline-block;width:22px;height:11px;border:1.5px solid currentColor;border-radius:3px}
.home-bar{position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:rgba(19,32,27,.85);z-index:4}

/* the soft contour (AuthBackdrop 'soft'): one wash disc and three hairline rings about a
   centre parked past the top-right corner — widths 165, 228, 291, the inner two stronger */
.bd{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.ring{position:absolute;border-radius:50%;border:.67px solid}
.wash{position:absolute;border-radius:50%;background:rgba(211,232,223,.38)}

/* the safe area and the bar */
.safe{position:absolute;left:0;right:0;top:54px;bottom:34px;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:4px 16px 8px}
.ib{width:44px;height:44px;display:flex;align-items:center;justify-content:center}
/* the back control: the iOS circle, 36 at the ink's .08, the chevron 20 */
.back{width:36px;height:36px;border-radius:18px;background:rgba(19,32,27,.08);display:flex;align-items:center;justify-content:center}
.back svg{width:20px;height:20px;color:var(--acc)}
.ttl{flex:1;text-align:center;font-size:21px;font-weight:600;color:var(--ink);line-height:26px}
/* the scroll: the column, and the footer as its later sibling */
.scroll{flex:1;position:relative;overflow:hidden}
.content{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;padding:0 20px}
.body{flex:1;display:flex;flex-direction:column;padding:8px 0 32px}
/* the copy: the Welcome's eyebrow, the Welcome's serif at the form size */
.eyebrow{margin-top:24px;font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--acc);line-height:17px}
.title{margin-top:8px;font-family:Georgia,"Times New Roman",serif;font-size:34px;line-height:38px;letter-spacing:-.4px;font-weight:700;color:var(--ink)}
.sub{margin-top:8px;font-size:16px;line-height:24px;color:var(--muted)}
/* the form, untouched */
.form{margin-top:24px;display:flex;flex-direction:column;gap:16px}
.fld{display:flex;flex-direction:column;gap:6px}
.lbl{margin-left:2px;font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--acc);line-height:16px}
.field{height:54px;box-sizing:border-box;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;padding-left:14px;padding-right:14px}
.field.focus{border-color:var(--acc)}
.field .glyph{width:20px;height:20px;flex:0 0 auto;color:var(--acc)}
.field .ph{flex:1;padding-left:12px;font-size:16px;color:var(--subtle)}
.field .ph.typed{color:var(--ink)}
.field .ph.dots{letter-spacing:2px;font-size:14px}
/* the actions: the Welcome's controls — the second in the scroll, the lead pinned */
.footer{flex:0 0 auto;padding:0 20px 12px;margin-bottom:12px;display:flex;flex-direction:column;gap:12px}
.hero{position:relative;height:58px;box-sizing:border-box;border-radius:22px;border:1px solid rgba(200,161,91,.62);display:flex;align-items:center;justify-content:center;gap:12px;font-size:17px;font-weight:600;letter-spacing:.1px}
.hero.lit{background:var(--forest);color:#FFFFFF;box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.hero.out{background:transparent;color:var(--forest)}
.hero > svg.g{width:22px;height:22px;color:var(--forest)}
.hero svg.c{position:absolute;right:18px;top:50%;width:18px;height:18px;margin-top:-9px}
.hero.lit svg.c{color:var(--gold)}
.hero.out svg.c{color:var(--forest)}
/* the keyboard frame: the slab, the lifted column, the risen footer */
.kb{position:absolute;left:0;right:0;bottom:0;box-sizing:border-box;height:336px;background:#D1D5DB;border-top:1px solid #C2C6CC;display:flex;align-items:center;justify-content:center;color:#5B6169;font-size:15px;font-weight:600;letter-spacing:.3px;z-index:6}
.kb span{display:block;text-align:center;line-height:22px}
.kb small{display:block;font-weight:500;font-size:12px;color:#7A818A}
.v-kb .content{transform:translateY(-24px)}
.v-kb .footer{transform:translateY(-208px)}
.v-kb .home-bar{display:none}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></symbol>
<symbol id="i-mail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.6"/><path d="m3.6 7.6 8.4 5.9 8.4-5.9"/></symbol>
<symbol id="i-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="10.5" rx="2.6"/><path d="M8.3 10.5V7.8a3.7 3.7 0 0 1 7.4 0v2.7"/></symbol>
<symbol id="i-phone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="6.6" y="2.6" width="10.8" height="18.8" rx="2.8"/><path d="M10.5 18.2h3"/></symbol>
<symbol id="i-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></symbol>
</defs></svg>
<div class="stage" id="stage"></div>
<script>
const contour = `<div class="bd">
    <div class="wash" style="left:261.3px;top:-190.0px;width:294.75px;height:294.75px"></div>
    <div class="ring" style="left:326.2px;top:-125.1px;width:165.1px;height:165.1px;border-color:rgba(13,107,82,.09)"></div>
    <div class="ring" style="left:294.8px;top:-156.6px;width:227.9px;height:227.9px;border-color:rgba(13,107,82,.09)"></div>
    <div class="ring" style="left:263.3px;top:-188.0px;width:290.8px;height:290.8px;border-color:rgba(13,107,82,.05)"></div>
  </div>`;
function frame(kb) {
  return `<div class="phone${kb ? ' v-kb' : ''}" data-shot="lux-signin-ship-light${kb ? '-keyboard' : ''}">
  <div class="status"><span>9:41</span><span class="r">●●● <i></i></span></div>
  ${contour}
  <div class="safe">
    <div class="topbar"><div class="ib"><div class="back"><svg><use href="#i-back"/></svg></div></div><div class="ttl">Sign in</div><div class="ib"></div></div>
    <div class="scroll">
      <div class="content"><div class="body">
        <div class="eyebrow">Welcome back</div>
        <div class="title">Sign in to Brazos</div>
        <p class="sub">Use the email and password connected to your account.</p>
        <div class="form">
          <div class="fld"><div class="lbl">Email</div><div class="field${kb ? ' focus' : ''}"><svg class="glyph"><use href="#i-mail"/></svg><span class="ph${kb ? ' typed' : ''}">${kb ? 'you@example.com' : 'you@example.com'}</span></div></div>
          <div class="fld"><div class="lbl">Password</div><div class="field"><svg class="glyph"><use href="#i-lock"/></svg><span class="ph dots">••••••••</span></div></div>
        </div>
      </div></div>
    </div>
    <div class="footer"><div class="hero lit"><span>Continue</span><svg class="c"><use href="#i-chev"/></svg></div><div class="hero out"><svg class="g"><use href="#i-phone"/></svg><span>Use Phone Number Instead</span><svg class="c"><use href="#i-chev"/></svg></div></div>
  </div>
  ${kb ? '<div class="kb"><span>keyboard<small>the system’s own — 336 with its autofill bar on this phone</small></span></div>' : ''}
  <div class="home-bar"></div>
</div>`;
}
document.getElementById('stage').innerHTML =
  `<div class="slot">${frame(false)}<div class="slot-label">at rest</div></div>` +
  `<div class="slot">${frame(true)}<div class="slot-label">the email field focused — Continue on the keyboard, the column lifted 24</div></div>`;
</script>
</body>
</html>
