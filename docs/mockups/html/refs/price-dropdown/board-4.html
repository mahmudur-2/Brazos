<!DOCTYPE html>
<html lang="en">
<head>

<title>Ask for bids – max saved</title>
<!--
  Price dropdown, board 4 of 8 — "Ask for bids – max saved".
  Unpacked 2026-09-28 (LUX-LIST-64) from the packed bundle .shots/refresh/refs/price-dropdown.html
  into readable HTML: fonts by <link>, real viewBox attributes, the bundle's runtime and
  component script left out (the boards are static states).
  Changed from the bundle: #37 — the "Ask for bids | Set a price" switch carries its glyphs
  (people, a price tag; filled on the chosen half, outline on the other, centred with the label);

  UX reference only (#36): the app builds the flow with its own components and colours.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<div style="width: 390px; height: 380px; box-sizing: border-box; padding: 24px 20px; display: flex; flex-direction: column; background: #091614; font-family: Inter, system-ui, sans-serif; color: #F1EDE1">
<div style="display: flex; gap: 4px; height: 52px; flex-shrink: 0; box-sizing: border-box; padding: 5px; background: #162521; border: 1px solid #2F5A4A; border-radius: 26px">
<button type="button" aria-pressed="true" style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 8px; flex-basis: 0; border: none; border-radius: 21px; background: #4FC58C; color: #062018; font-size: 16px; font-weight: 700"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="9" cy="7.5" r="3.6"/><path d="M2.5 19.5c0-3.3 2.9-6 6.5-6s6.5 2.7 6.5 6v.5h-13z"/><circle cx="17" cy="8.5" r="2.8"/><path d="M16.2 13.6c3.1-.3 5.8 2 5.8 5.2v1.2h-4.9v-.5c0-2.3-.9-4.4-2.4-5.9.5-.1 1-.1 1.5 0z"/></svg><span>Ask for bids</span></button>

</div>
<div style="display: flex; flex-direction: column; gap: 8px; margin-top: 20px">
<div style="font-size: 11px; line-height: 13px; font-weight: 700; letter-spacing: 1.6px; color: #D4A24C">MAX BUDGET</div>
<button type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="Max budget: up to $175" style="display: flex; align-items: center; justify-content: space-between; height: 52px; flex-shrink: 0; box-sizing: border-box; padding: 0 18px 0 20px; background: #0C241F; border: 1px solid #2F5A4A; border-radius: 26px; color: #F1EDE1; font-size: 17px; font-weight: 700; text-align: left">
<span style="display: flex; align-items: baseline; gap: 6px"><span style="font-size: 15px; font-weight: 500; color: #A9B8B1">Up to</span><span style="font-size: 18px; font-weight: 700; color: #F3F1E8">$175</span></span>
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4FC58C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>

<div style="font-size: 13px; line-height: 18px; color: #A9B8B1">Workers can bid up to this amount.</div>

<div style="flex-grow: 1"></div>
<div style="display: flex; flex-direction: column; gap: 12px">
<div style="font-size: 13px; line-height: 18px; color: #A9B8B1; text-align: center">Publishing makes this job visible to workers nearby.</div>
<button type="button" style="height: 54px; border: none; border-radius: 27px; background: linear-gradient(135deg, #8DF0C0, #4FC58C); color: #062018; font-size: 17px; font-weight: 700">Publish</button>
</div>
</div>
