<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Post a Job bottom bar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/*
  Post a Job — bottom bar reference. 1 CSS px = 1 iPhone point. Screen width 390.
  (m) = measured from the "AFTER - LUX, SIMPLER" mockup · (i) = inferred.
*/
:root{
  --page-bg:#081412;        /* (m) screen background just above the bar */
  --muted:#A9B8B1;          /* (m) helper text */

  /* action bar — no space above or below the buttons */
  --bar-bg:#0A231E;         /* (m) */
  --bar-line:#2C4D44;       /* (m) 1px line on top of the bar */
  --bar-pad-y:0px;          /* 0 space above and below the buttons */
  --bar-pad-side:16px;      /* equal space on both sides */
  --bar-gap:14px;           /* space between the buttons (mockup ~10.6) */
  --btn-h:52px;             /* (m) */
  /* widths split 3 : 4 (Save draft : Publish), as in the mockup → 147 / 197 on a 390 screen */

  --draft-bg:#081F19;       /* (m) */
  --draft-border:#2E765A;   /* (m) */
  --draft-text:#ABB4AE;     /* (m) */
  --draft-icon:#AFB8B3;     /* (m) */

  --publish-bg:#45C88B;     /* (m) flat fill */
  --publish-ink:#030A12;    /* (m) text + rocket */
  --publish-rim:rgba(255,255,255,.09); /* (m) faint lighter edge on the button */
  --publish-glow:rgba(69,200,139,.24); /* (i) halo around the button */
  --icon-gap:10px;          /* rocket ↔ "Publish" (mockup 16, tightened) */

  /* tab bar */
  --nav-h:80px;             /* (m) includes the phone's home-bar strip */
  --nav-bg:#071C16;         /* (m) */
  --nav-line:#1F342E;       /* (m) */
  --nav-active:#40CB87;     /* (m) Home icon + label */
  --nav-icon:#8B9691;       /* (m) inactive icons */
  --nav-label:#9FA9A3;      /* (m) inactive labels */
  --fab-bg:#0C6C54;         /* (m) center + button */
  --fab-glow:rgba(12,108,84,.45); /* (i) */
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#0D0D0D;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;color:#F1EDE1;padding:24px 0 40px}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.caption{max-width:390px;margin:0 auto 12px;padding:0 16px;font-size:12px;color:#8A948F}

.screen{position:relative;width:390px;max-width:100%;margin:0 auto;background:var(--page-bg);overflow:hidden}

/* a little of the screen above the bar */
.above{padding:18px 20px 16px}
.note{display:flex;gap:11px;align-items:center;margin:0;font-size:13px;line-height:1.35;color:var(--muted);white-space:nowrap}
.note svg{flex:none}

/* action bar */
.actions{position:relative;display:flex;gap:var(--bar-gap);align-items:center;padding:var(--bar-pad-y) var(--bar-pad-side);background:var(--bar-bg);border-top:1px solid var(--bar-line)}
.btn{height:var(--btn-h);padding:0;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:16px;line-height:1;white-space:nowrap;transition:transform .12s ease}
.draft{flex:3 1 0;min-width:0;gap:12px;background:var(--draft-bg);border:1.5px solid var(--draft-border);color:var(--draft-text);font-weight:600;box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}
.publish{position:relative;z-index:1;flex:4 1 0;min-width:0;gap:var(--icon-gap);background:var(--publish-bg);border:0;color:var(--publish-ink);font-weight:700;letter-spacing:-.2px;box-shadow:inset 0 0 0 1px var(--publish-rim),0 0 22px var(--publish-glow)}
.publish .label{padding-right:1px}
.publish .rocket{transition:transform .25s cubic-bezier(.3,.7,.4,1.4)}
.publish:hover .rocket,.publish:active .rocket{transform:translate(2px,-2px)}
.btn:active{transform:scale(.98)}
.btn:focus-visible,.tab:focus-visible,.fab:focus-visible{outline:2px solid #7EE2B4;outline-offset:3px}
@media (prefers-reduced-motion:reduce){.btn,.publish .rocket{transition:none}}

/* tab bar */
.tabbar{position:relative;z-index:2;height:var(--nav-h);background:var(--nav-bg);border-top:1px solid var(--nav-line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px;padding:13px 0 0;background:none;border:0;color:var(--nav-label);font-size:12px;font-weight:500;line-height:14px}
.tab .ic{height:26px;display:flex;align-items:center;justify-content:center}
.tab svg{display:block}
.tab.on{color:var(--nav-active);font-weight:600}
.tab.on svg{filter:drop-shadow(0 0 5px rgba(64,203,135,.35))}
.fab-cell{display:flex;justify-content:center;padding-top:4px}
.fab{width:60px;height:60px;border-radius:15px;border:0;background:var(--fab-bg);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px var(--fab-glow)}
/* iOS home indicator — drawn by the phone, shown only for spacing */
.home-ind{position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:#E8ECEB;pointer-events:none}
</style>
</head>
<body>

<p class="caption">Post a Job — bottom bar reference · 390 pt wide (1 px = 1 pt)</p>

<div class="screen">
  <div class="above">
    <p class="note">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4FC58C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M8 12.3l2.7 2.7L16.2 9.4"/></svg>
      Publishing makes this job visible to workers nearby.
    </p>
  </div>

  <div class="actions">
    <button type="button" class="btn draft">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#AFB8B3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></svg>
      Save draft
    </button>
    <button type="button" class="btn publish">
      <!-- rocket: body, solid window, two fins, exhaust flame (~21 pt, 1.6 pt stroke) -->
      <svg class="rocket" width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#030A12" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 15l-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/>
        <circle cx="15.9" cy="8.1" r="1.35" fill="#030A12" stroke="none"/>
        <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/>
        <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>
        <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/>
      </svg>
      <span class="label">Publish</span>
    </button>
  </div>

  <nav class="tabbar" aria-label="Main">
    <button type="button" class="tab on" aria-current="page">
      <span class="ic"><svg width="28" height="26" viewBox="1.2 2.4 21.6 19.6" aria-hidden="true"><path d="M1.6 11.1L12 2.6l4.8 3.9V4.3c0-.4.3-.7.7-.7h1.8c.4 0 .7.3.7.7v4.6l2.4 2.2c.4.4.4 1-.1 1.3-.3.2-.8.2-1.1 0l-.7-.6v8.8c0 .7-.6 1.3-1.3 1.3h-4.4v-5.6c0-.6-.4-1-1-1h-3.6c-.6 0-1 .4-1 1v5.6H4.8c-.7 0-1.3-.6-1.3-1.3v-8.8l-.7.6c-.3.2-.8.2-1.1 0-.5-.3-.5-.9-.1-1.3z" fill="#40CB87"/></svg></span>
      Home
    </button>
    <button type="button" class="tab">
      <span class="ic"><svg width="24" height="24" viewBox="2.6 2.6 19.3 19.3" fill="none" stroke="#8B9691" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="7" vector-effect="non-scaling-stroke"/><path d="M15.8 15.8L21 21" vector-effect="non-scaling-stroke"/></svg></span>
      Discover
    </button>
    <div class="fab-cell">
      <button type="button" class="fab" aria-label="Post a job">
        <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.3" stroke-linecap="round" aria-hidden="true"><path d="M12 2.5v19M2.5 12h19"/></svg>
      </button>
    </div>
    <button type="button" class="tab">
      <span class="ic"><svg width="25" height="25" viewBox="2.1 1.7 19.8 20.2" fill="none" stroke="#8B9691" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.6a9 9 0 0 1-13.3 7.9L3 21l1.5-4.4A9 9 0 1 1 21 11.6z" vector-effect="non-scaling-stroke"/><circle cx="8.3" cy="11.6" r="1.1" fill="#8B9691" stroke="none"/><circle cx="12" cy="11.6" r="1.1" fill="#8B9691" stroke="none"/><circle cx="15.7" cy="11.6" r="1.1" fill="#8B9691" stroke="none"/></svg></span>
      Inbox
    </button>
    <button type="button" class="tab">
      <span class="ic"><svg width="24" height="25" viewBox="2.9 2.6 18.2 19.3" fill="none" stroke="#8B9691" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="7.8" r="4.3" vector-effect="non-scaling-stroke"/><path d="M3.8 21c.6-4 4-6.6 8.2-6.6s7.6 2.6 8.2 6.6" vector-effect="non-scaling-stroke"/></svg></span>
      Profile
    </button>
    <span class="home-ind" aria-hidden="true"></span>
  </nav>
</div>

</body>
</html>
