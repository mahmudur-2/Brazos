<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Summary redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --outside:#0D0D0D;
  --page:#091614;
  --card:#0A231F;
  --card-top:#0A2521;
  --border:#304F47;
  --divider:#142F29;
  --cream:#F3F1E8;
  --muted:#A9B8B1;
  --faint:#7E918A;
  --gold:#E9C170;
  --green:#4FC58C;
  --green-lt:#7EE2B4;
  --ink:#062018;
  --error:#EE8B78;
  --raised:#162521;
  --raised-border:#2F5A4A;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--outside);color:var(--cream);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}

/* mockup-only controls */
.demo{max-width:390px;margin:20px auto 12px;padding:0 16px;display:flex;flex-direction:column;gap:8px}
.demo small{color:#8A948F;font-size:12px}
.demo-tabs{display:flex;gap:6px}
.demo-tabs button{flex:1;min-width:0;height:36px;padding:0 6px;border-radius:18px;border:1px solid #2F3B38;background:#151A19;color:#C8CFCB;font-size:13px;font-weight:600;white-space:nowrap}
.demo-tabs button[aria-pressed="true"]{background:#E8ECE9;color:#0D0D0D;border-color:#E8ECE9}

/* the phone screen */
.phone{position:relative;max-width:390px;margin:0 auto 40px;background:var(--page);border-radius:28px;padding:24px 20px 28px}
@media (max-width:430px){.phone{border-radius:0;margin-bottom:0}.demo{margin-top:12px}}

.card{background:linear-gradient(165deg,var(--card-top) 0%,var(--card) 60%);border:1px solid var(--border);border-radius:24px;padding:22px 20px 6px}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:1.8px;color:var(--gold)}
.hint{font-size:12px;color:var(--faint)}

.intro{display:block;width:100%;text-align:left;background:none;border:0;padding:0;margin:12px 0 0;border-radius:12px}
.title{display:block;font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:25px;line-height:1.2;color:var(--cream)}
.desc{display:block;margin-top:10px;font-size:15px;line-height:1.55;color:var(--muted)}

.label{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:1.2px;color:var(--muted)}
.label svg{flex:none;width:14px;height:14px;fill:none;stroke:var(--green);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.label .count{letter-spacing:0;font-weight:500;color:var(--faint)}

/* ---------- media ---------- */
.media{position:relative;margin-top:18px}
.media-head{display:flex;justify-content:space-between;align-items:center;min-height:20px}
.link{background:none;border:0;padding:12px;margin:-12px -12px -12px 0;color:var(--green-lt);font-size:13px;font-weight:600}
.link.strong{font-weight:700}
.mgrid{display:grid;gap:10px;margin-top:12px}
.tw{position:relative;min-width:0}
.tile{position:relative;display:block;width:100%;height:100%;padding:0;border:1px solid var(--border);border-radius:14px;overflow:hidden;background:#0F2A25}
.tw.hero .tile{border-radius:16px}
.tile svg.scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.tile[aria-disabled="true"]{cursor:default}
.tile.failed{border-color:var(--error)}
.pbadge{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:28px;height:28px;border-radius:50%;background:rgba(6,32,24,.75);border:1px solid rgba(243,241,232,.35);display:flex;align-items:center;justify-content:center}
.tw.hero .pbadge{width:52px;height:52px}
.tw.hero .pbadge svg{width:22px;height:22px}
.dur{position:absolute;right:5px;bottom:5px;font-size:10.5px;font-weight:700;color:#fff;background:rgba(0,0,0,.6);padding:2px 5px;border-radius:6px;line-height:1.2}
.tw.hero .dur{right:10px;bottom:10px;font-size:12px;padding:3px 7px}
.ovl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:rgba(3,11,9,.62);font-size:11px;font-weight:700;color:var(--cream)}
.ovl.more{font-size:20px;background:rgba(3,11,9,.58)}
.ovl.fail{background:rgba(3,11,9,.74);color:var(--error)}
.add-tile{border:1.3px dashed #3E6358;background:transparent;display:flex;align-items:center;justify-content:center}
.add-tile[aria-expanded="true"]{border-style:solid;border-color:var(--green);background:rgba(79,197,140,.08)}
.add-wide{margin-top:12px;width:100%;height:64px;border-radius:14px;border:1.3px dashed #3E6358;background:transparent;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--green-lt);font-size:14px;font-weight:600}
.add-wide[aria-expanded="true"]{border-style:solid;border-color:var(--green)}
/* iPhone-style remove button: small light circle on the corner, 44px tap area */
.x{position:absolute;top:-15px;right:-15px;width:44px;height:44px;padding:0;border:0;background:none;display:flex;align-items:center;justify-content:center;z-index:2}
.x span{width:24px;height:24px;border-radius:50%;background:#E9ECE8;box-shadow:0 2px 6px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center}
.mnote{margin:10px 0 0;font-size:12.5px;line-height:1.4;color:var(--muted)}

/* add menu */
.menu{position:absolute;z-index:12;width:210px;padding:6px;background:var(--raised);border:1px solid var(--raised-border);border-radius:16px;box-shadow:0 14px 34px rgba(0,0,0,.55);display:none}
.menu.open{display:block}
.menu button{display:flex;align-items:center;gap:12px;width:100%;height:46px;padding:0 12px;border:0;border-radius:10px;background:transparent;color:var(--cream);font-size:15px;font-weight:600;text-align:left}
.menu button:hover,.menu button:focus-visible{background:#1F3A33;outline:none}
.menu .sep{height:1px;background:#29403A;margin:2px 8px}

/* ---------- details grid ---------- */
.divider{height:1px;background:var(--divider);margin:20px 0 2px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:14px}
.cell{display:block;align-self:start;text-align:left;background:none;border:0;padding:14px 0;min-height:44px;border-radius:10px}
.cell.wide{grid-column:1 / -1}
.value{display:block;margin-top:5px;font-size:16px;font-weight:600;line-height:1.35;color:var(--cream)}
.value .sub{font-size:15px;font-weight:500;color:var(--muted)}
.value .money{color:var(--gold);font-weight:700}
.value.add{display:flex;align-items:center;gap:6px;color:var(--green-lt)}
.intro:active,.cell:active{background:rgba(243,241,232,.04)}
button:focus-visible{outline:2px solid var(--green-lt);outline-offset:3px}

.foot{display:flex;gap:10px;align-items:flex-start;margin:20px 2px 16px;color:var(--muted);font-size:14px;line-height:1.45}
.foot svg{flex:none;margin-top:1px}
.publish{width:100%;height:54px;border:0;border-radius:27px;background:linear-gradient(135deg,#8DF0C0,#4FC58C);color:var(--ink);font-size:17px;font-weight:700}
.publish:disabled{background:#073328;color:#909594;cursor:default}

/* toast (with optional Undo) */
.toast{position:fixed;left:50%;bottom:100px;transform:translate(-50%,8px);opacity:0;transition:opacity .2s,transform .2s;display:flex;align-items:center;gap:14px;background:#E9ECE8;color:#0D1411;font-size:13px;font-weight:600;padding:10px 14px;border-radius:12px;white-space:nowrap;pointer-events:none;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{background:none;border:0;padding:4px 2px;color:#0B6B45;font-size:13px;font-weight:700}
.toast button[hidden]{display:none}

/* full-screen media viewer */
.viewer{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:min(390px,100%);background:#030B09;display:none;flex-direction:column;z-index:20}
.viewer.open{display:flex}
.v-top{display:flex;justify-content:space-between;align-items:center;padding:16px 14px 8px}
.v-count{font-size:14px;font-weight:600}
.v-kind{font-size:12px;color:var(--muted);margin-top:2px}
.icon-btn{width:44px;height:44px;flex:none;border-radius:22px;border:0;background:rgba(243,241,232,.08);display:flex;align-items:center;justify-content:center}
.v-stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;touch-action:pan-y;user-select:none}
.v-media{position:relative;width:100%;aspect-ratio:4/3}
.v-media svg.scene{width:100%;height:100%;display:block}
.v-big-play{position:absolute;inset:0;margin:auto;width:72px;height:72px;border-radius:50%;border:1.5px solid rgba(243,241,232,.35);background:rgba(6,32,24,.78);display:flex;align-items:center;justify-content:center}
.v-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(3,11,9,.55)}
.v-prev{left:8px}.v-next{right:8px}
.v-nav[hidden]{display:none}
.v-controls{display:flex;align-items:center;gap:12px;padding:10px 14px;min-height:64px}
.v-controls[hidden]{display:none}
.v-bar{flex:1;height:4px;border-radius:2px;background:rgba(243,241,232,.18);position:relative;overflow:hidden}
.v-bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--green);border-radius:2px}
.v-time{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:78px;text-align:right}
.v-dots{display:flex;gap:6px;justify-content:center;padding:12px 0 30px}
.v-dots span{width:6px;height:6px;border-radius:3px;background:rgba(243,241,232,.25);transition:width .2s}
.v-dots span.on{background:var(--cream);width:18px}
</style>
</head>
<body>

<div class="demo">
  <small>Mockup controls, not part of the app</small>
  <div class="demo-tabs" role="group" aria-label="Example to show">
    <button type="button" data-state="full" aria-pressed="true">Filled in</button>
    <button type="button" data-state="editing" aria-pressed="false">Editing media</button>
    <button type="button" data-state="missing" aria-pressed="false">Details missing</button>
  </div>
</div>

<main class="phone" id="phone">
  <section class="card" aria-label="Job summary">
    <div class="card-head">
      <span class="eyebrow">JOB SUMMARY</span>
      <span class="hint">Tap any detail to edit</span>
    </div>

    <button class="intro" type="button" data-edit="Title and description">
      <span class="title">Assemble a three-seat sofa and an armchair</span>
      <span class="desc">Both pieces are boxed in the living room. Tools on hand: an Allen key set and a drill. Please take the packaging with you if you can — the building has no big-item pickup this week.</span>
    </button>

    <div class="media" id="media">
      <div class="media-head" id="mediaHead"></div>
      <div id="mediaBody"></div>
      <div class="menu" id="menu" role="menu" aria-label="Add media">
        <button type="button" role="menuitem" data-action="add-photo">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4FC58C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><circle cx="9" cy="10" r="1.6"/><path d="M20.5 16l-4.5-4.5L7 19"/></svg>
          Add a photo
        </button>
        <div class="sep"></div>
        <button type="button" role="menuitem" data-action="add-video">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4FC58C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="13" height="12" rx="2.5"/><path d="M16 10.5l5-3v9l-5-3z"/></svg>
          Add a video
        </button>
      </div>
    </div>

    <div class="divider"></div>

    <div class="grid">
      <button class="cell" type="button" data-edit="Category">
        <span class="label"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>CATEGORY</span>
        <span class="value">Furniture assembly</span>
      </button>
      <button class="cell" type="button" data-edit="Area">
        <span class="label"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg>AREA</span>
        <span class="value">Flatbush, Brooklyn</span>
      </button>
      <button class="cell wide" type="button" data-edit="Timing">
        <span class="label"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>TIMING</span>
        <span class="value" id="vTiming"></span>
      </button>
      <button class="cell wide" type="button" data-edit="Address">
        <span class="label"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg>ADDRESS (PRIVATE)</span>
        <span class="value" id="vAddress"></span>
      </button>
      <button class="cell wide" type="button" data-edit="Budget">
        <span class="label"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="6" width="17" height="13" rx="2.5"/><path d="M3.5 10.5h17"/><circle cx="16.5" cy="15" r="1.2"/></svg>BUDGET</span>
        <span class="value" id="vBudget"></span>
      </button>
    </div>
  </section>

  <p class="foot">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7EE2B4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M8 12.3l2.7 2.7L16.2 9.4"/></svg>
    <span>Publishing makes this job visible to workers nearby.</span>
  </p>
  <button class="publish" type="button" id="publish" data-action="publish">Publish</button>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button type="button" id="toastAct" data-action="undo" hidden>Undo</button></div>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Job photos and videos">
  <div class="v-top">
    <div>
      <div class="v-count" id="vCount">1 / 3</div>
      <div class="v-kind" id="vKind">Photo</div>
    </div>
    <button class="icon-btn" type="button" id="vClose" aria-label="Close">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F3F1E8" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="v-stage" id="vStage">
    <div class="v-media" id="vMedia"></div>
    <button class="icon-btn v-nav v-prev" type="button" id="vPrev" aria-label="Previous">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F3F1E8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
    </button>
    <button class="icon-btn v-nav v-next" type="button" id="vNext" aria-label="Next">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F3F1E8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </button>
  </div>
  <div class="v-controls" id="vControls" hidden>
    <button class="icon-btn" type="button" id="vPlayPause" aria-label="Play"></button>
    <div class="v-bar"><i id="vProgress"></i></div>
    <span class="v-time" id="vTime">0:00 / 0:14</span>
  </div>
  <div class="v-dots" id="vDots"></div>
</div>

<script>
(function(){
  // Stand-in pictures for the owner's uploads (drawn, not real photos).
  var SCENES = {
    boxes:
      '<rect width="400" height="300" fill="#22322E"/>' +
      '<rect x="262" y="36" width="104" height="116" rx="3" fill="#3C5A53"/><rect x="268" y="42" width="92" height="104" fill="#5E8277"/><rect x="312" y="42" width="4" height="104" fill="#3C5A53"/>' +
      '<rect y="208" width="400" height="92" fill="#3A2F25"/><rect y="204" width="400" height="6" fill="#2B3935"/>' +
      '<ellipse cx="200" cy="262" rx="175" ry="22" fill="#2E261E"/>' +
      '<rect x="24" y="116" width="250" height="100" rx="4" fill="#A27B4F"/><rect x="24" y="116" width="250" height="14" rx="3" fill="#B98F5E"/>' +
      '<rect x="138" y="116" width="22" height="100" fill="#D1B27C" opacity=".85"/><rect x="52" y="158" width="60" height="28" rx="2" fill="#F1E9D6" opacity=".8"/>' +
      '<rect x="236" y="148" width="140" height="72" rx="4" fill="#8E6A45"/><rect x="236" y="148" width="140" height="12" rx="3" fill="#A57C52"/>' +
      '<rect x="296" y="148" width="18" height="72" fill="#C7A673" opacity=".85"/>',
    chair:
      '<rect width="400" height="300" fill="#1F2E2B"/>' +
      '<rect x="56" y="28" width="150" height="150" rx="3" fill="#3C5A53"/><rect x="64" y="36" width="134" height="134" fill="#6F948A"/>' +
      '<rect x="129" y="36" width="4" height="134" fill="#3C5A53"/><rect x="64" y="101" width="134" height="4" fill="#3C5A53"/>' +
      '<rect y="214" width="400" height="86" fill="#382D24"/><rect y="210" width="400" height="6" fill="#2A3834"/>' +
      '<ellipse cx="265" cy="236" rx="100" ry="12" fill="#2A221B"/>' +
      '<rect x="190" y="108" width="150" height="118" rx="4" fill="#A27B4F"/><rect x="190" y="108" width="150" height="14" rx="3" fill="#B98F5E"/>' +
      '<rect x="255" y="108" width="20" height="118" fill="#D1B27C" opacity=".85"/><rect x="204" y="150" width="40" height="22" rx="2" fill="#F1E9D6" opacity=".8"/>',
    room:
      '<rect width="400" height="300" fill="#1A2825"/>' +
      '<rect x="150" y="44" width="100" height="100" rx="3" fill="#35514A"/><rect x="156" y="50" width="88" height="88" fill="#57786E"/>' +
      '<rect y="198" width="400" height="102" fill="#33291F"/><rect y="194" width="400" height="6" fill="#24322E"/>' +
      '<ellipse cx="200" cy="246" rx="160" ry="30" fill="#4A3B2C"/>' +
      '<rect x="34" y="148" width="156" height="64" rx="4" fill="#9B764B"/><rect x="100" y="148" width="16" height="64" fill="#C9AA74" opacity=".85"/>' +
      '<rect x="228" y="158" width="116" height="56" rx="4" fill="#8A6743"/><rect x="278" y="158" width="14" height="56" fill="#C2A06D" opacity=".85"/>'
  };
  function scene(name){
    return '<svg class="scene" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true">' + SCENES[name] + '</svg>';
  }
  var ICON_PLAY = '<svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z" fill="#F3F1E8"/></svg>';
  var ICON_PLAY_BIG = '<svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z" fill="#F3F1E8"/></svg>';
  var ICON_PLAY_MID = '<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z" fill="#F3F1E8"/></svg>';
  var ICON_PAUSE = '<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1" fill="#F3F1E8"/><rect x="13.5" y="5" width="4" height="14" rx="1" fill="#F3F1E8"/></svg>';
  var ICON_PLUS = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7EE2B4" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';
  var ICON_PLUS_TILE = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#7EE2B4" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';
  var ICON_MEDIA = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><circle cx="9" cy="10" r="1.6"/><path d="M20.5 16l-4.5-4.5L7 19"/></svg>';
  var ICON_X = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#0D1411" stroke-width="3.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  var ICON_RETRY = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#EE8B78" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>';
  var RING = 94.25; // circumference of the upload ring (r = 15)

  // Placeholder: the app's real limit is unknown — check it in the code.
  var LIMIT = 8;

  var uid = 1;
  function mk(type, sceneName, dur, status){ return { id: uid++, type: type, scene: sceneName, dur: dur || 0, status: status || 'done', p: 0 }; }
  function preset(name){
    var filled = {
      timing: 'Sat, Sep 26 · 8–11 AM',
      address: 'Apt 3C, Flatbush Ave',
      budget: '<span class="sub">Up to</span> <span class="money">$120</span>'
    };
    if (name === 'missing') return { media: [], editing: false, timing: 'Flexible', address: null, budget: 'No maximum' };
    var media = [mk('photo','boxes'), mk('photo','chair'), mk('video','room',14)];
    if (name === 'editing') media.push(mk('photo','boxes',0,'failed'));
    return { media: media, editing: name === 'editing', timing: filled.timing, address: filled.address, budget: filled.budget };
  }

  var $ = function(id){ return document.getElementById(id); };
  var S = preset('full');
  var timers = {};
  var lastRemoved = null;

  function fmt(s){ s = Math.floor(s); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); }
  function kind(item){ return item.type === 'video' ? 'Video' : 'Photo'; }
  function countText(media){
    var ok = media.filter(function(m){ return m.status !== 'failed'; });
    var p = ok.filter(function(m){ return m.type === 'photo'; }).length, v = ok.length - p, parts = [];
    if (p) parts.push(p + (p === 1 ? ' photo' : ' photos'));
    if (v) parts.push(v + (v === 1 ? ' video' : ' videos'));
    return parts.join(', ');
  }
  function doneItems(){ return S.media.filter(function(m){ return m.status === 'done'; }); }

  // ---------- media rendering ----------
  function tileHTML(item, o){
    var failed = item.status === 'failed', uploading = item.status === 'uploading';
    var action = failed ? 'retry' : uploading ? '' : (o.more ? 'more' : 'view');
    var inner = scene(item.scene);
    if (item.type === 'video' && item.status === 'done' && !o.more)
      inner += '<span class="pbadge">' + (o.hero ? ICON_PLAY_MID : ICON_PLAY) + '</span><span class="dur">' + fmt(item.dur) + '</span>';
    if (uploading)
      inner += '<span class="ovl"><svg width="30" height="30" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="15" fill="none" stroke="rgba(243,241,232,.25)" stroke-width="3"/>' +
               '<circle id="ring-' + item.id + '" cx="18" cy="18" r="15" fill="none" stroke="#7EE2B4" stroke-width="3" stroke-linecap="round" stroke-dasharray="' + RING + '" stroke-dashoffset="' + (RING * (1 - item.p)) + '" transform="rotate(-90 18 18)"/></svg></span>';
    if (failed) inner += '<span class="ovl fail">' + ICON_RETRY + 'Retry</span>';
    if (o.more) inner += '<span class="ovl more">+' + o.more + '</span>';
    var label = failed ? kind(item) + ' failed to upload. Tap to retry'
              : uploading ? kind(item) + ' uploading'
              : o.more ? 'Show all ' + (o.more + 3) + ' photos and videos'
              : (item.type === 'video' ? 'Video, ' + fmt(item.dur) : 'Photo') + '. Open';
    var btn = '<button type="button" class="tile' + (failed ? ' failed' : '') + '" ' +
              (action ? 'data-action="' + action + '" data-id="' + item.id + '"' : 'aria-disabled="true"') +
              ' aria-label="' + label + '">' + inner + '</button>';
    var x = o.edit ? '<button type="button" class="x" data-action="remove" data-id="' + item.id + '" aria-label="Remove ' + kind(item).toLowerCase() + '"><span>' + ICON_X + '</span></button>' : '';
    return '<div class="tw' + (o.hero ? ' hero' : '') + '" style="aspect-ratio:' + o.ar + '">' + btn + x + '</div>';
  }

  function renderMedia(){
    var m = S.media, n = m.length, head, body = '';
    head = '<span class="label">' + ICON_MEDIA + 'MEDIA' +
           (n ? ' <span class="count">· ' + (S.editing ? n + ' of ' + LIMIT : countText(m) || (n + ' uploading')) + '</span>' : '') + '</span>';
    if (S.editing) head += '<button class="link strong" type="button" data-action="done">Done</button>';
    else if (n) head += '<button class="link" type="button" data-action="edit">Edit</button>';

    if (!n){
      body = '<button class="add-wide" type="button" data-action="add" aria-haspopup="menu" aria-expanded="false">' + ICON_PLUS + 'Add photos or videos</button>';
    } else if (!S.editing){
      // View: always fill the full width.
      var cols = Math.min(n, 4), ar = n === 1 ? '16 / 9' : n === 2 ? '4 / 3' : '1 / 1';
      var shown = n > 4 ? m.slice(0, 4) : m;
      body = '<div class="mgrid" style="grid-template-columns:repeat(' + cols + ',minmax(0,1fr))">';
      shown.forEach(function(item, i){
        body += tileHTML(item, { ar: ar, hero: n === 1, more: (n > 4 && i === 3) ? n - 3 : 0 });
      });
      body += '</div>';
    } else {
      // Edit: 4 across, X on every item, + at the end.
      body = '<div class="mgrid" style="grid-template-columns:repeat(4,minmax(0,1fr))">';
      m.forEach(function(item){ body += tileHTML(item, { ar: '1 / 1', edit: true }); });
      if (n < LIMIT)
        body += '<div class="tw" style="aspect-ratio:1 / 1"><button type="button" class="tile add-tile" data-action="add" aria-haspopup="menu" aria-expanded="false" aria-label="Add a photo or video">' + ICON_PLUS_TILE + '</button></div>';
      body += '</div>';
      if (n >= LIMIT) body += '<p class="mnote">That’s the limit. Remove one to add another.</p>';
    }
    $('mediaHead').innerHTML = head;
    $('mediaBody').innerHTML = body;
    if (menuOpen && !document.querySelector('[data-action="add"]')) closeMenu(false);
    if (menuOpen){ var anchor = markAnchor(); if (anchor) placeMenu(anchor); }
    updatePublish();
  }

  // ---------- add menu ----------
  var menuOpen = false;
  function markAnchor(){
    var a = document.querySelector('#mediaBody [data-action="add"]');
    if (a) a.setAttribute('aria-expanded', menuOpen ? 'true' : 'false');
    return a;
  }
  function placeMenu(anchor){
    var menu = $('menu'), box = $('media').getBoundingClientRect(), r = anchor.getBoundingClientRect();
    var w = 210, left = r.left - box.left + r.width / 2 - w / 2;
    left = Math.max(0, Math.min(left, box.width - w));
    menu.style.left = left + 'px';
    menu.style.top = (r.bottom - box.top + 8) + 'px';
  }
  function openMenu(anchor){
    placeMenu(anchor);
    $('menu').classList.add('open');
    menuOpen = true; markAnchor();
    $('menu').querySelector('button').focus();
  }
  function closeMenu(refocus){
    if (!menuOpen) return;
    $('menu').classList.remove('open');
    menuOpen = false;
    var a = markAnchor();
    if (refocus && a) a.focus();
  }

  // ---------- add / remove / upload ----------
  var photoScenes = ['chair', 'room', 'boxes'], videoScenes = ['boxes', 'chair', 'room'], videoDurs = [9, 22, 31];
  var addCount = 0;
  function addItem(type){
    if (S.media.length >= LIMIT) return;
    var k = addCount++;
    var item = type === 'video' ? mk('video', videoScenes[k % 3], videoDurs[k % 3], 'uploading') : mk('photo', photoScenes[k % 3], 0, 'uploading');
    S.media.push(item);
    S.editing = true;
    closeMenu(false);
    renderMedia();
    startUpload(item);
  }
  function startUpload(item){
    item.status = 'uploading'; item.p = 0;
    clearInterval(timers[item.id]);
    timers[item.id] = setInterval(function(){
      item.p = Math.min(1, item.p + 0.05);
      var ring = $('ring-' + item.id);
      if (ring) ring.setAttribute('stroke-dashoffset', RING * (1 - item.p));
      if (item.p >= 1){
        clearInterval(timers[item.id]); delete timers[item.id];
        item.status = 'done';
        renderMedia();
      }
    }, 70);
    updatePublish();
  }
  function removeItem(id){
    var i = S.media.findIndex(function(m){ return m.id === id; });
    if (i < 0) return;
    var item = S.media[i];
    var wasUploading = item.status === 'uploading';
    clearInterval(timers[id]); delete timers[id];
    S.media.splice(i, 1);
    renderMedia();
    if (wasUploading){ lastRemoved = null; toast('Upload canceled'); }
    else { lastRemoved = { item: item, index: i }; toast(kind(item) + ' removed', true); }
    var next = document.querySelectorAll('#mediaBody .x')[Math.min(i, S.media.length - 1)] || document.querySelector('#mediaBody [data-action="add"]') || document.querySelector('[data-action="done"]');
    if (next) next.focus();
  }
  function undo(){
    if (!lastRemoved || S.media.length >= LIMIT) return;
    S.media.splice(Math.min(lastRemoved.index, S.media.length), 0, lastRemoved.item);
    lastRemoved = null;
    hideToast();
    renderMedia();
  }
  function retry(id){
    var item = S.media.find(function(m){ return m.id === id; });
    if (!item) return;
    renderMedia();
    startUpload(item);
    renderMedia();
  }
  function updatePublish(){
    var up = S.media.some(function(m){ return m.status === 'uploading'; });
    var b = $('publish');
    b.disabled = up;
    b.textContent = up ? 'Uploading…' : 'Publish';
  }
  function publish(){
    if (S.media.some(function(m){ return m.status === 'failed'; })) toast('Retry or remove the failed upload first');
    else toast('Job published (mockup)');
  }

  // ---------- toast ----------
  var toastTimer;
  function toast(msg, withUndo){
    $('toastMsg').textContent = msg;
    $('toastAct').hidden = !withUndo;
    $('toast').classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, withUndo ? 4000 : 1800);
  }
  function hideToast(){ $('toast').classList.remove('show'); }
  var EDIT_MSG = { Budget: 'Opens the price picker' };

  // ---------- other details ----------
  function renderDetails(){
    $('vTiming').textContent = S.timing;
    var a = $('vAddress');
    if (S.address){ a.className = 'value'; a.textContent = S.address; }
    else { a.className = 'value add'; a.innerHTML = ICON_PLUS + 'Add address'; }
    $('vBudget').innerHTML = S.budget;
  }

  // ---------- one click handler for everything ----------
  document.addEventListener('click', function(e){
    var el = e.target.closest('[data-action],[data-edit],[data-state]');
    var act = el && el.getAttribute('data-action');
    if (menuOpen && !e.target.closest('#menu') && act !== 'add') closeMenu(false);
    if (!el) return;

    if (el.hasAttribute('data-state')){
      document.querySelectorAll('[data-state]').forEach(function(b){ b.setAttribute('aria-pressed', b === el ? 'true' : 'false'); });
      Object.keys(timers).forEach(function(k){ clearInterval(timers[k]); delete timers[k]; });
      S = preset(el.getAttribute('data-state'));
      lastRemoved = null; hideToast(); closeMenu(false);
      renderMedia(); renderDetails();
      return;
    }
    if (el.hasAttribute('data-edit')){
      var k = el.getAttribute('data-edit');
      toast(EDIT_MSG[k] || ('Opens ' + k + ' to edit'));
      return;
    }
    var id = +el.getAttribute('data-id');
    switch (act){
      case 'edit': S.editing = true; renderMedia(); var d = document.querySelector('[data-action="done"]'); if (d) d.focus(); break;
      case 'done': S.editing = false; closeMenu(false); renderMedia(); var ed = document.querySelector('[data-action="edit"]'); if (ed) ed.focus(); break;
      case 'add': if (menuOpen) closeMenu(true); else openMenu(el); break;
      case 'add-photo': addItem('photo'); break;
      case 'add-video': addItem('video'); break;
      case 'remove': removeItem(id); break;
      case 'retry': retry(id); break;
      case 'view':
      case 'more': openViewer(id, el); break;
      case 'publish': publish(); break;
      case 'undo': undo(); break;
    }
  });
  window.addEventListener('resize', function(){
    var a = menuOpen && document.querySelector('#mediaBody [data-action="add"]');
    if (a) placeMenu(a);
  });

  // ---------- full-screen viewer ----------
  var vItems = [], idx = 0, opener = null, playing = false, t = 0, tick = null;
  function stopVideo(){ playing = false; clearInterval(tick); tick = null; }
  function showItem(){
    stopVideo(); t = 0;
    var item = vItems[idx];
    $('vCount').textContent = (idx + 1) + ' / ' + vItems.length;
    $('vKind').textContent = item.type === 'video' ? 'Video · ' + fmt(item.dur) : 'Photo';
    var html = scene(item.scene);
    if (item.type === 'video') html += '<button class="v-big-play" type="button" id="vBigPlay" aria-label="Play video">' + ICON_PLAY_BIG + '</button>';
    $('vMedia').innerHTML = html;
    $('vControls').hidden = item.type !== 'video';
    $('vPrev').hidden = idx === 0;
    $('vNext').hidden = idx === vItems.length - 1;
    var dots = '';
    for (var i = 0; i < vItems.length; i++) dots += '<span class="' + (i === idx ? 'on' : '') + '"></span>';
    $('vDots').innerHTML = vItems.length > 1 ? dots : '';
    paintVideo();
    var bp = $('vBigPlay'); if (bp) bp.addEventListener('click', togglePlay);
  }
  function paintVideo(){
    var item = vItems[idx]; if (!item || item.type !== 'video') return;
    $('vProgress').style.width = (t / item.dur * 100) + '%';
    $('vTime').textContent = fmt(t) + ' / ' + fmt(item.dur);
    $('vPlayPause').innerHTML = playing ? ICON_PAUSE : ICON_PLAY_MID;
    $('vPlayPause').setAttribute('aria-label', playing ? 'Pause' : 'Play');
    var bp = $('vBigPlay'); if (bp) bp.style.display = playing ? 'none' : 'flex';
  }
  function togglePlay(){
    var item = vItems[idx];
    if (playing){ stopVideo(); paintVideo(); return; }
    if (t >= item.dur) t = 0;
    playing = true;
    tick = setInterval(function(){
      t = Math.min(item.dur, t + 0.1);
      if (t >= item.dur) stopVideo();
      paintVideo();
    }, 100);
    paintVideo();
  }
  function openViewer(id, from){
    vItems = doneItems();
    if (!vItems.length) return;
    var i = vItems.findIndex(function(m){ return m.id === id; });
    idx = i < 0 ? Math.min(3, vItems.length - 1) : i;
    opener = from;
    $('viewer').classList.add('open');
    document.body.style.overflow = 'hidden';
    showItem();
    $('vClose').focus();
  }
  function closeViewer(){
    stopVideo();
    $('viewer').classList.remove('open');
    document.body.style.overflow = '';
    if (opener && document.body.contains(opener)) opener.focus();
  }
  function go(dir){
    var n = idx + dir;
    if (n < 0 || n >= vItems.length) return;
    idx = n; showItem();
  }
  $('vClose').addEventListener('click', closeViewer);
  $('vPrev').addEventListener('click', function(){ go(-1); });
  $('vNext').addEventListener('click', function(){ go(1); });
  $('vPlayPause').addEventListener('click', togglePlay);
  document.addEventListener('keydown', function(e){
    if ($('viewer').classList.contains('open')){
      if (e.key === 'Escape') closeViewer();
      if (e.key === 'ArrowLeft') go(-1);
      if (e.key === 'ArrowRight') go(1);
    } else if (menuOpen && e.key === 'Escape'){
      closeMenu(true);
    }
  });
  var sx = null;
  $('vStage').addEventListener('pointerdown', function(e){ sx = e.clientX; });
  $('vStage').addEventListener('pointerup', function(e){
    if (sx === null) return;
    var dx = e.clientX - sx; sx = null;
    if (Math.abs(dx) > 40) go(dx < 0 ? 1 : -1);
  });

  renderMedia();
  renderDetails();
})();
</script>
</body>
</html>
