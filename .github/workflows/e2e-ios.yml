name: e2e iOS

# The Maestro flows in .maestro/ on an iOS simulator, on a free GitHub macOS
# runner. The app binary is the latest finished EAS `e2e-test` simulator build
# (or the one named by build_id). Builds are metered quota, so this workflow
# starts one only when the dispatch sets build_this_commit: one build of this
# commit, which the flows then test. The run summary says whether the app under
# test was made from the commit the run tests.

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: EAS build id to test (empty = latest finished e2e-test build)
        type: string
        required: false
      build_this_commit:
        description: Make one e2e-test build of this commit first and test it (one metered EAS build)
        type: boolean
        default: false
        required: false

permissions:
  contents: read

concurrency:
  group: e2e-ios
  cancel-in-progress: true

jobs:
  # Only when build_this_commit is set: off by default, so no build and no cost.
  build:
    name: Build this commit (one metered EAS build)
    if: inputs.build_this_commit
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      build_id: ${{ steps.build.outputs.build_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # eas-cli reads the project id from app.config.ts, which needs the deps.
      - name: Install dependencies
        run: npm ci

      # eas build waits for the build to finish (its default); --json prints it as an array.
      - name: Build the e2e-test simulator app of this commit
        id: build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes eas-cli@27.7.0 build --platform ios --profile e2e-test --non-interactive --json > "$RUNNER_TEMP/build.json"
          id=$(node -e '
            const b = [].concat(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")))[0];
            if (!b || !b.id) throw new Error("EAS returned no build id");
            console.log(b.id);
          ' "$RUNNER_TEMP/build.json")
          echo "build_id=$id" >> "$GITHUB_OUTPUT"

  maestro:
    name: Maestro flows on the iOS simulator
    # Runs after the build job, or without it when build_this_commit is off; never after a failed build.
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: macos-15
    # Run 24 (2026-11-09): 01-03 green, 04 running, cut at 45 minutes. On the public-repo Macs a
    # flow takes 7-11 minutes, plus about 10 for setup and the driver: ten flows need ~2 hours.
    timeout-minutes: 180

    steps:
      # Third-party actions are pinned to a full commit SHA, as in ci.yml.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # eas-cli reads the project id from app.config.ts, which needs the deps.
      - name: Install dependencies
        run: npm ci

      - name: Download the simulator build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # Passed through env, never spliced into the script (injection). The build
          # this run made comes first, then the dispatch's build_id.
          BUILD_ID: ${{ needs.build.outputs.build_id || inputs.build_id }}
        run: |
          meta="$RUNNER_TEMP/build.json"
          if [ -n "$BUILD_ID" ]; then
            npx --yes eas-cli@27.7.0 build:view "$BUILD_ID" --json > "$meta"
          else
            npx --yes eas-cli@27.7.0 build:list --platform ios --profile e2e-test --status finished --limit 1 --json --non-interactive > "$meta"
          fi
          # Checks the build, writes the App-under-test line to the run summary, prints the archive URL.
          url=$(node scripts/e2e-build.mjs "$meta")
          archive="$RUNNER_TEMP/app-archive"
          dir="$RUNNER_TEMP/e2e-app"
          rm -rf "$dir" && mkdir "$dir"
          curl -fsSL "$url" -o "$archive"
          # EAS simulator builds ship as .tar.gz; accept .zip too.
          if unzip -tq "$archive" > /dev/null 2>&1; then
            unzip -q "$archive" -d "$dir"
          else
            tar -xzf "$archive" -C "$dir"
          fi
          app=$(find "$dir" -maxdepth 3 -type d -name '*.app' -print -quit)
          [ -n "$app" ] || { echo "no .app in the build archive"; exit 1; }
          echo "APP_PATH=$app" >> "$GITHUB_ENV"

      - name: Use the market's clock (America/New_York)
        # The wizard's "Today" is the device's local date; the running-late chips compare with the
        # New York date (lib/runningLate.ts). On a UTC runner the two disagree from 7 PM to midnight
        # New York (e2e run 15, 2026-11-08). The simulator takes the host's zone.
        run: |
          sudo systemsetup -settimezone America/New_York
          date
      - name: Boot an iPhone simulator and install the app
        run: |
          # Prefer an "iPhone 16", else any iPhone; newest iOS runtime first.
          udid=$(xcrun simctl list devices available --json | node -e '
            const devices = JSON.parse(require("fs").readFileSync(0, "utf8")).devices;
            const version = (key) => (key.match(/iOS-([\d-]+)$/) || [, "0"])[1].split("-").map(Number);
            const newer = (a, b) => { const x = version(a), y = version(b); for (let i = 0; i < 3; i++) if ((y[i] || 0) !== (x[i] || 0)) return (y[i] || 0) - (x[i] || 0); return 0; };
            const phones = Object.keys(devices).filter((k) => /iOS-/.test(k)).sort(newer)
              .flatMap((k) => devices[k].filter((d) => d.isAvailable !== false && /^iPhone/.test(d.name)));
            const pick = phones.find((d) => d.name === "iPhone 16") || phones[0];
            if (!pick) throw new Error("no available iPhone simulator");
            console.error(`simulator ${pick.name} ${pick.udid}`);
            console.log(pick.udid);
          ')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install booted "$APP_PATH"

      - name: Install Maestro
        env:
          MAESTRO_VERSION: 2.12.1
          MAESTRO_CLI_NO_ANALYTICS: 1
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release zip, not the installer script: that script exits 0 on a
          # corrupt (504) download and leaves nothing installed.
          # Two paths to the same asset: the web download edge (504s killed runs
          # 2026-11-08 x2 and run 20 on 2026-11-09), then the API asset route via gh.
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o "$RUNNER_TEMP/maestro.zip" "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip" \
            || { echo "web download failed; trying the API asset route"; rm -f "$RUNNER_TEMP/maestro.zip";
                 gh release download "cli-${MAESTRO_VERSION}" -R mobile-dev-inc/maestro -p maestro.zip -O "$RUNNER_TEMP/maestro.zip"; }
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$HOME/.maestro-dist"
          bin=$(find "$HOME/.maestro-dist" -type f -path '*/bin/maestro' | head -1)
          [ -n "$bin" ] || { echo "no bin/maestro in the release zip"; exit 1; }
          echo "$(dirname "$bin")" >> "$GITHUB_PATH"
          out=$("$bin" --version)
          echo "$out"
          printf '%s\n' "$out" | grep -qxF "$MAESTRO_VERSION" || { echo "expected Maestro $MAESTRO_VERSION"; exit 1; }

      - name: Run the Maestro flows
        env:
          MAESTRO_E2E_PHONE: ${{ secrets.MAESTRO_E2E_PHONE }}
          MAESTRO_E2E_OTP: ${{ secrets.MAESTRO_E2E_OTP }}
          MAESTRO_E2E_PHONE_2: ${{ secrets.MAESTRO_E2E_PHONE_2 }}
          MAESTRO_E2E_OTP_2: ${{ secrets.MAESTRO_E2E_OTP_2 }}
          # Maestro hands MAESTRO_* env vars to the flows; they title jobs "E2E <id>".
          MAESTRO_RUN_ID: ${{ github.run_id }}
          # Run 23 (2026-11-09, the public-repo Macs run about half as fast): the XCUITest
          # driver was "not ready in time" at the 2-minute default. Ten minutes, and one
          # retry when Maestro ends before a single flow ran.
          MAESTRO_DRIVER_STARTUP_TIMEOUT: 600000
          MAESTRO_CLI_NO_ANALYTICS: 1
        run: |
          xcrun simctl io booted recordVideo --codec=h264 --force e2e.mp4 &
          recorder=$!
          status=0
          # e2e-junit holds one result per flow, always the last attempt's. A rerun's first attempt goes
          # to e2e-reruns, which nothing counts; it stays empty on a run without a rerun.
          mkdir -p e2e-debug e2e-junit e2e-reruns
          # Run 37 (2026-11-10): Maestro's own iOS driver died in flow 03 (DeviceUnreachableException,
          # mobile-dev-inc/maestro#3538, open: a status-bar read races the closing keyboard) and the run
          # stopped there. One `maestro test` per flow, in file order: each flow gets a fresh driver, and
          # a red flow no longer hides the ones after it, so one run reports all ten.
          for flow in .maestro/[0-9][0-9]-*.yml; do
            name=$(basename "$flow" .yml)
            # One counter for both retries: a flow gets at most one extra pass, whatever the reason.
            attempt=1
            while :; do
              rc=0
              maestro test "$flow" --format junit --output "e2e-junit/$name.xml" --debug-output e2e-debug || rc=$?
              if [ "$rc" -ne 0 ] && [ "$attempt" -lt 2 ] && ! grep -q "<testcase" "e2e-junit/$name.xml" 2>/dev/null; then
                echo "Maestro ended before $name ran (driver start-up); retrying once"
                attempt=$((attempt + 1))
                continue
              fi
              # Maestro's driver died mid-flow (#3538): one more pass, only for the flows a second pass
              # cannot fool (01 and 10 change nothing; 07 and 09 fail loudly on what a cut pass leaves).
              # 02-06 move one shared job along, so a second pass would repeat steps already done. 08 is
              # out: a pass cut between the two taps of a switch would leave that setting flipped unseen.
              if [ "$rc" -ne 0 ] && [ "$attempt" -lt 2 ] && grep -q "DeviceUnreachableException" "e2e-junit/$name.xml" 2>/dev/null; then
                case "$name" in
                  01-*|07-*|09-*|10-*)
                    mv "e2e-junit/$name.xml" "e2e-reruns/$name.attempt1.xml"
                    line="RERUN $name: Maestro's driver died on attempt 1 (DeviceUnreachableException); attempt 1's junit is e2e-reruns/$name.attempt1.xml"
                    echo "$line"
                    echo "- $line" >> "$GITHUB_STEP_SUMMARY"
                    attempt=$((attempt + 1))
                    continue
                    ;;
                esac
              fi
              break
            done
            [ "$rc" -eq 0 ] || status=1
          done
          # SIGINT lets simctl finish the mp4; the flows' exit code is kept.
          kill -INT "$recorder"
          wait "$recorder" || true
          exit "$status"

      # The repo is public: anyone signed in to GitHub can download artifacts, and the video shows the
      # test phone numbers and codes being typed. Only an encrypted bundle leaves the Mac.
      - name: Encrypt results
        if: always()
        env:
          ARTIFACT_KEY: ${{ secrets.ARTIFACT_KEY }}
        run: |
          if [ -z "$ARTIFACT_KEY" ]; then echo "ARTIFACT_KEY secret is missing; nothing is uploaded"; exit 1; fi
          mkdir -p e2e-results
          cp -R e2e-junit e2e-reruns e2e-debug e2e.mp4 ./*.png ~/.maestro/tests e2e-results/ 2>/dev/null || true
          tar -cf - e2e-results | gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 \
            --passphrase-fd 3 -o e2e-results.tar.gpg 3<<<"$ARTIFACT_KEY"
          rm -rf e2e-results

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-ios
          path: e2e-results.tar.gpg
          if-no-files-found: warn
          retention-days: 14

      - name: Shut the simulator down
        if: always()
        run: xcrun simctl shutdown all
