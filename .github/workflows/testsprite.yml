# Generated by `testsprite ci init github`, then cut down (lean E6): there is no
# preview deployment, so no pull_request trigger, no placeholder step and no
# --target-url. The backend tests in tests/testsprite/ carry the staging
# functions address in their own code and send no Supabase or Stripe secret:
# they prove from outside that every server function refuses a caller it
# should refuse. The only secret here is the TestSprite key.
name: TestSprite

on:
  workflow_dispatch:
  push:
    branches: [mainexpo]
    paths:
      - 'supabase/functions/**'
      - 'tests/testsprite/**'
      - '.github/workflows/testsprite.yml'

permissions:
  contents: read

jobs:
  contract:
    name: server-function contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A later push waits for the running gate instead of cancelling it: a
    # cancelled job leaves its TestSprite run billing in the Portal.
    concurrency:
      group: testsprite
      cancel-in-progress: false
    env:
      TESTSPRITE_API_KEY: ${{ secrets.TESTSPRITE_API_KEY }}
      TESTSPRITE_PROJECT_ID: 52eda076-5d8c-489c-9af4-33ae9044697b

    steps:
      # Third-party actions are pinned to a full commit SHA, not a tag.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc

      # ci run's exit code is the gate; never re-judge pass or fail here.
      - name: Run the contract tests
        run: >-
          npx --yes @testsprite/testsprite-cli@0.15.0 ci run
          --project "$TESTSPRITE_PROJECT_ID"
          --env staging
          --report junit --report-file testsprite-junit.xml
          --fail-on-skipped

      - name: Upload the JUnit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: testsprite-junit
          path: testsprite-junit.xml
          if-no-files-found: ignore
