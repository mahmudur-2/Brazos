name: Migrate staging

# Migration files, applied to the STAGING database and to nothing else.
# Production is never automated: it stays hand-applied by the operator, in
# their own shell, one migration at a time. No job in this repository targets
# it and none ever should.
#
# The manual trigger IS the approval gate. `workflow_dispatch` is the only
# event this workflow answers to, and that single line is the whole design:
# the operator's tap on "Run workflow" in the Actions tab is what approves a
# migration for staging. It must never be replaced or supplemented by a
# `push:` trigger — that would apply whatever landed on mainexpo with nobody
# deciding to, which is exactly the decision this file exists to preserve.
#
# The `staging` environment is restricted to the mainexpo branch and holds the
# three secrets read below: SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF and
# SUPABASE_DB_PASSWORD. The project ref is one of them, so it appears here
# only as a secret reference and never as a literal.
#
# A migration that adds a new enum value must be split into its own file. Each
# migration file runs as one transaction, and Postgres will not let a new enum
# value be USED in the transaction that ADDED it: the `alter type ... add
# value` goes in one file, and everything that references the new value goes
# in the next one.

on:
  workflow_dispatch:

permissions:
  contents: read

# Two migration jobs must never race against one database, and a run that is
# already applying must never be cancelled half-way by the next one.
concurrency:
  group: db-push-staging
  cancel-in-progress: false

jobs:
  migrate:
    name: apply migrations to staging
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15

    steps:
      # Third-party actions are pinned to a full commit SHA, not a tag: a tag
      # is mutable and can be repointed at new code after review. This is the
      # same action and the same SHA that ci.yml checks out with.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The CLI comes from npm, pinned to the exact version the operator runs
      # locally — no third-party action installs it. A setup action is a
      # mutable dependency that would receive this job's database credentials,
      # and ci.yml's own note explains why a mutable reference is not
      # acceptable even where no credential is in reach.
      - name: Link the staging project
        run: npx --yes supabase@2.116.0 link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      # BEFORE: what staging has applied, and what is pending, as of now.
      - name: List migrations (before)
        run: npx --yes supabase@2.116.0 migration list
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Apply pending migrations
        run: npx --yes supabase@2.116.0 db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      # AFTER: the same list again. The two are the job's evidence — read them
      # against each other to see exactly what this run applied.
      - name: List migrations (after)
        run: npx --yes supabase@2.116.0 migration list
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
